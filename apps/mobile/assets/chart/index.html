    else if (parts[i].type === 'minute') m = parseInt(parts[i].value, 10);
    else if (parts[i].type === 'weekday') wd = parts[i].value;
  }
  if (wd === 'Sat' || wd === 'Sun') return false;
  var mins = h * 60 + m;
  return mins >= 570 && mins < 960;         // 09:30 .. 16:00
}


/* ===== chart-web/src/05-pointer.js ===== */
/**
 * Kai's pointer.
 *
 * This is the single element that turns "the state changed" into "somebody did
 * that". A price line that simply appears is a render. A violet cursor that
 * travels to the price, pauses, and only THEN leaves a line behind is a person
 * working. Nothing else in this lane buys as much for as little.
 *
 * It is violet because violet is Kai (palette lock 14: volt = you, violet = Kai,
 * cyan = the market). A volt pointer would be Kai impersonating the user.
 *
 * It is a DOM element, not canvas: it must be able to travel OFF the plot — over
 * the timeframe rail, over the price axis — and it must never be clipped by the
 * chart's own canvas bounds.
 */
function KaiPointer(root) {
  var el = document.createElement('div');
  el.className = 'kai-pointer';
  el.setAttribute('aria-hidden', 'true');
  el.innerHTML =
    '<div class="kai-pointer-halo"></div>' +
    '<div class="kai-pointer-dot"></div>';
  root.appendChild(el);

  this.el = el;
  this.x = -60;
  this.y = -60;
  this.visible = false;
  this._apply();
}

KaiPointer.prototype._apply = function () {
  // translate3d only: transform and opacity are the two properties that never
  // touch layout or paint, which is what keeps this at 60fps next to a chart
  // that is also redrawing.
  this.el.style.transform = 'translate3d(' + this.x.toFixed(1) + 'px,' + this.y.toFixed(1) + 'px,0)';
};

/** Travel to a point, eased, with the small overshoot a hand has. */
KaiPointer.prototype.moveTo = function (x, y, duration, done) {
  var self = this;
  var x0 = this.x, y0 = this.y;
  if (!this.visible) {
    // Appearing at the destination would be teleporting. Fade in where the
    // travel STARTS, then travel — nothing in the world appears mid-flight.
    this.x = x0 = x - (x - x0) * 0.18;
    this.y = y0 = y - (y - y0) * 0.18;
    this.show();
  }
  Motion.run({
    duration: duration,
    ease: 'pointer',
    onStep: function (p) {
      self.x = x0 + (x - x0) * p;
      self.y = y0 + (y - y0) * p;
      self._apply();
    },
    onDone: done || function () {},
  });
};

/** Snap without motion — used when reduced motion is on, and on re-show. */
KaiPointer.prototype.placeAt = function (x, y) {
  this.x = x; this.y = y; this._apply();
};

KaiPointer.prototype.show = function () {
  this.visible = true;
  this.el.classList.add('is-on');
};

KaiPointer.prototype.hide = function () {
  this.visible = false;
  this.el.classList.remove('is-on');
};

/**
 * The press. 90ms down, then release — the same shape as a finger, and short
 * enough that it reads as a click rather than a squeeze.
 */
KaiPointer.prototype.press = function (done) {
  var self = this;
  this.el.classList.add('is-press');
  var ms = reducedMotion() ? 0 : 90;
  setTimeout(function () {
    self.el.classList.remove('is-press');
    if (done) done();
  }, ms);
};

/* ------------------------------------------------------------------ */
/* The timeframe rail                                                  */
/* ------------------------------------------------------------------ */

/**
 * The rail lives INSIDE the chart surface rather than in React chrome above it,
 * for one reason: Kai's pointer has to be able to press it. A pointer that
 * travels to the edge of the WebView and stops, while a button outside changes
 * state on its own, is worse than no pointer at all.
 *
 * Active = volt, because choosing a timeframe is a USER action even when Kai is
 * the one doing it on the user's behalf. Kai's authorship is shown by the violet
 * pointer sitting on the button, not by recolouring the control.
 */
function TimeframeRail(root, onPick) {
  var el = document.createElement('div');
  el.className = 'tf-rail';
  el.setAttribute('role', 'tablist');
  el.setAttribute('aria-label', 'Chart timeframe');
  root.appendChild(el);

  this.el = el;
  this.buttons = {};
  this.value = null;
  this._onPick = onPick;
}

TimeframeRail.prototype.setOptions = function (options, value) {
  var self = this;
  this.el.innerHTML = '';
  this.buttons = {};
  for (var i = 0; i < options.length; i++) {
    (function (tf) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tf-btn';
      b.textContent = tf;
      b.setAttribute('role', 'tab');
      b.setAttribute('data-tf', tf);
      // Feedback on pointer-DOWN, never on release: the moment a press shows up
      // late is the moment the whole surface stops feeling direct.
      b.addEventListener('pointerdown', function () { b.classList.add('is-down'); });
      var up = function () { b.classList.remove('is-down'); };
      b.addEventListener('pointerup', up);
      b.addEventListener('pointercancel', up);
      b.addEventListener('pointerleave', up);
      b.addEventListener('click', function () { self._onPick(tf, 'user'); });
      self.el.appendChild(b);
      self.buttons[tf] = b;
    })(options[i]);
  }
  this.setValue(value);
};

TimeframeRail.prototype.setValue = function (tf) {
  this.value = tf;
  for (var k in this.buttons) {
    if (!Object.prototype.hasOwnProperty.call(this.buttons, k)) continue;
    var on = k === tf;
    this.buttons[k].classList.toggle('is-on', on);
    this.buttons[k].setAttribute('aria-selected', on ? 'true' : 'false');
  }
};

/** Where the pointer should travel to, in page coordinates. */
TimeframeRail.prototype.centerOf = function (tf, rootRect) {
  var b = this.buttons[tf];
  if (!b) return null;
  var r = b.getBoundingClientRect();
  return { x: r.left - rootRect.left + r.width / 2, y: r.top - rootRect.top + r.height / 2 };
};

/** The visible press Kai performs. Same class the finger produces. */
TimeframeRail.prototype.pressVisual = function (tf, done) {
  var b = this.buttons[tf];
  if (!b) { if (done) done(); return; }
  b.classList.add('is-down');
  var ms = reducedMotion() ? 0 : 90;
  setTimeout(function () { b.classList.remove('is-down'); if (done) done(); }, ms);
};


/* ===== chart-web/src/05a-draw.js ===== */
/**
 * Drawing on the chart with your own hands.
 *
 * THE GAP THIS FILLS, in the owner's words: "little things like no manual
 * drawing abilities". Everything on this chart until now was placed by Kai or
 * computed from bars. A trader's first instinct in front of a chart is to draw
 * a line on it, and there was nothing to draw with — which quietly says the
 * chart is something you watch rather than something you use.
 *
 * WHAT THIS FILE IS, AND WHAT IT DELIBERATELY IS NOT. It is the GESTURE half:
 * which surface was touched, what shape that turns into, and which handle is
 * being dragged. It is NOT a renderer — every drawing is an ordinary annotation
 * and goes through the same `AnnotationLayer` that draws Kai's, so a user's
 * trendline and Kai's are the same object drawn by the same code, differing
 * only in `provenance`. That is the whole reason a user's drawing can be
 * selected, hidden, explained and persisted without any of that being built
 * twice.
 *
 * ONE POINTER PATH FOR FINGER AND MOUSE. Pointer Events are supported by every
 * surface this app runs on — WKWebView, Android WebView, and desktop browsers
 * for Expo web — so there is one set of handlers rather than a touch path and a
 * mouse path that drift apart. The test drives both.
 *
 * THE LIBRARY'S GESTURES ARE TURNED OFF WHILE A TOOL IS ACTIVE, and back on the
 * moment it is put away. Drawing a trendline across a chart that is panning
 * underneath the finger produces a line through two prices that were never both
 * on screen, which is worse than no line at all.
 *
 * NOTHING HERE WRITES TO A DATABASE. The page has no network (see 07-bridge.js).
 * A finished drawing is POSTED UP to the host, which persists it through the
 * same annotations API Kai's marks go through and sends the authoritative row
 * back down. Until that round trip lands the drawing is on screen as a draft, so
 * the line appears under the finger rather than after a server.
 */

/** How close a finger has to get to a handle for it to count as grabbing it. */
var HANDLE_HIT = 16;
/** Below this, a drag was a tap. Fingers are not precise and a tap is not a box. */
var DRAG_MIN = 6;

function DrawTool(chart) {
  this.c = chart;
  this.tool = null;        // null | 'level' | 'trendline' | 'zone'
  this.selectedId = null;
  this._draft = null;      // the annotation being created or edited
  this._grab = null;       // which handle, when editing
  this._from = null;       // pointer down position
  this._seq = 0;
  this._pressTimer = 0;
  this._saved = null;      // the library's gesture options, while a tool is out
  this._bind();
}

/* ------------------------------------------------------------------ */
/* Coordinates                                                         */
/* ------------------------------------------------------------------ */

/** Price at a y, or null off the scale. */
DrawTool.prototype._price = function (y) {
  var p = this.c.series.coordinateToPrice(y);
  return p == null || !isFinite(p) ? null : p;
};

/**
 * The bar time at an x.
 *
 * `coordinateToTime` answers null past either end of the data, and a drawing
 * anchored just off the last bar is a completely reasonable thing to want — so
 * the logical scale is used instead, which extrapolates. Snapping to whole bars
 * is deliberate: a trendline anchored a third of the way through a candle
 * implies a precision the data does not have.
 */
DrawTool.prototype._time = function (x) {
  var bars = this.c.bars;
  if (!bars.length) return null;
  var logical = this.c.chart.timeScale().coordinateToLogical(x);
  if (logical == null || !isFinite(logical)) return null;
  var idx = Math.round(logical);
  if (idx >= 0 && idx < bars.length) return bars[idx].time;
  var step = bars.length > 1 ? bars[1].time - bars[0].time : 86400;
  if (idx < 0) return bars[0].time + idx * step;
  return bars[bars.length - 1].time + (idx - (bars.length - 1)) * step;
};

/** Where the pointer is, in the plot's own coordinates. */
DrawTool.prototype._at = function (e) {
  var r = this.c.host.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
};

/** True when this x is over the price axis rather than the plot. */
DrawTool.prototype._overAxis = function (x) {
  var w = 0;
  try { w = this.c.chart.priceScale('right').width(); } catch (e) { w = 0; }
  return w > 0 && x >= this.c.host.clientWidth - w - 2;
};

/* ------------------------------------------------------------------ */
/* Tool state                                                          */
/* ------------------------------------------------------------------ */

/**
 * Pick up a tool, or put it down.
 *
 * WHILE A TOOL IS OUT THE CHART DOES NOT MOVE. The options are saved and
 * restored rather than reset to a guess, so putting the tool away returns the
 * chart to whatever the host had configured — embedded or on the stage, which
 * are genuinely different gesture sets.
 */
DrawTool.prototype.setTool = function (tool) {
  var next = tool === 'level' || tool === 'trendline' || tool === 'zone' ? tool : null;
  if (next === this.tool) return;
  this.tool = next;
  this.c.host.style.cursor = next ? 'crosshair' : '';

  if (next && !this._saved) {
    var o = this.c.chart.options();
    this._saved = { handleScroll: o.handleScroll, handleScale: o.handleScale };
    this.c.chart.applyOptions({
      handleScroll: { mouseWheel: false, pressedMouseMove: false, horzTouchDrag: false, vertTouchDrag: false },
      handleScale: { axisPressedMouseMove: false, mouseWheel: false, pinch: false, axisDoubleClickReset: false },
    });
  } else if (!next && this._saved) {
    this.c.chart.applyOptions(this._saved);
    this._saved = null;
  }
  // Picking up a tool clears the selection: you are about to make a new thing,
  // and leaving handles on an old one invites a drag that edits the wrong shape.
  if (next) this.select(null);
  post({ type: 'draw.tool', payload: { tool: this.tool } });
};

DrawTool.prototype.select = function (id) {
  if (this.selectedId === id) return;
  this.selectedId = id;
  this.c.annotations.setSelected(id);
  var a = this._find(id);
  post({
    type: 'draw.selected',
    payload: { id: id, kind: a ? a.kind : null, provenance: a ? a.provenance : null, text: a ? a.text : null },
  });
};

DrawTool.prototype._find = function (id) {
  if (!id) return null;
  var items = this.c.annotations.items();
  for (var i = 0; i < items.length; i++) if (items[i].id === id) return items[i];
  return null;
};

/** Remove the selected drawing. Only ever the user's own — see `_hitOwn`. */
DrawTool.prototype.deleteSelected = function () {
  var id = this.selectedId;
  var a = this._find(id);
  if (!a || a.provenance !== 'user') return false;
  this.select(null);
  this.c.annotations.remove([id]);
  post({ type: 'draw.deleted', payload: { id: id } });
  return true;
};

/* ------------------------------------------------------------------ */
/* The gestures                                                        */
/* ------------------------------------------------------------------ */

DrawTool.prototype._bind = function () {
  var self = this;
  var host = this.c.host;
  host.addEventListener('pointerdown', function (e) { self._down(e); });
  host.addEventListener('pointermove', function (e) { self._move(e); });
  host.addEventListener('pointerup', function (e) { self._up(e); });
  host.addEventListener('pointercancel', function () { self._cancel(); });
};

/** The handles of the selected drawing, in plot coordinates. */
DrawTool.prototype._handles = function (a) {
  if (!a) return [];
  var self = this;
  var toY = function (p) { return p == null ? null : self.c.series.priceToCoordinate(p); };
  var toX = function (t) {
    if (t == null) return null;
    var u = typeof t === 'number' ? t : Math.floor(Date.parse(t) / 1000);
    return self.c.chart.timeScale().timeToCoordinate(u);
  };
  var W = this.c.host.clientWidth;
  var out = [];
  if (a.kind === 'trendline') {
    out.push({ h: 'from', x: toX(a.ts_from), y: toY(a.price) });
    out.push({ h: 'to', x: toX(a.ts_to), y: toY(a.price2) });
  } else if (a.kind === 'zone') {
    var x1 = toX(a.ts_from);
    var x2 = a.ts_to == null ? W - 60 : toX(a.ts_to);
    out.push({ h: 'top', x: x1 == null ? 20 : x1 + 14, y: toY(a.price) });
    out.push({ h: 'bottom', x: x1 == null ? 20 : x1 + 14, y: toY(a.price2) });
    out.push({ h: 'from', x: x1, y: (toY(a.price) + toY(a.price2)) / 2 });
    if (a.ts_to != null) out.push({ h: 'to', x: x2, y: (toY(a.price) + toY(a.price2)) / 2 });
  } else {
    // A level has one handle, and it is deliberately not at x=0: a control in
    // the corner of the plot is a control under the chip that names the line.
    out.push({ h: 'price', x: W * 0.5, y: toY(a.price) });
  }
  return out.filter(function (p) { return p.x != null && p.y != null; });
};

/** The user-authored drawing under this point, if any. Kai's are not grabbable. */
DrawTool.prototype._hitOwn = function (pt) {
  var items = this.c.annotations.items();
  var best = null;
  var bestD = Infinity;
  var self = this;
  var toY = function (p) { return p == null ? null : self.c.series.priceToCoordinate(p); };
  for (var i = 0; i < items.length; i++) {
    var a = items[i];
    if (a.provenance !== 'user' || a.status === 'hidden' || a.status === 'deleted') continue;
    var d = Infinity;
    if (a.kind === 'zone') {
      var y1 = toY(a.price), y2 = toY(a.price2);
      if (y1 == null || y2 == null) continue;
      var top = Math.min(y1, y2), bot = Math.max(y1, y2);
      d = pt.y >= top - 4 && pt.y <= bot + 4 ? 0 : Math.min(Math.abs(pt.y - top), Math.abs(pt.y - bot));
    } else if (a.kind === 'trendline') {
      var hs = this._handles(a);
      if (hs.length < 2) continue;
      d = distToSegment(pt, hs[0], hs[1]);
    } else {
      var y = toY(a.price);
      if (y == null) continue;
      d = Math.abs(pt.y - y);
    }
    if (d < bestD) { bestD = d; best = a; }
  }
  return bestD <= 14 ? best : null;
};

DrawTool.prototype._down = function (e) {
  var pt = this._at(e);
  if (this._overAxis(pt.x)) return;
  this._from = pt;

  // --- editing an existing drawing ---
  if (!this.tool) {
    /**
     * A BUTTON BEATS A PROXIMITY GRAB, and it has to be checked first.
     *
     * The bin sits near the drawing's own corner, which on a trendline is right
     * beside an endpoint handle — and a handle grabs anything within sixteen
     * pixels. Checked in the other order, every tap on the bin was read as the
     * start of a drag and the drawing could not be deleted at all. An explicit
     * control the user aimed at always wins over something they were merely
     * near.
     */
    var onChrome = this.c.annotations.hitTest(pt.x, pt.y);
    if (onChrome === TRASH_ID || onChrome === OVERFLOW_ID) return;

    var sel = this._find(this.selectedId);
    var hs = this._handles(sel);
    for (var i = 0; i < hs.length; i++) {
      if (Math.abs(hs[i].x - pt.x) <= HANDLE_HIT && Math.abs(hs[i].y - pt.y) <= HANDLE_HIT) {
        this._grab = { id: sel.id, handle: hs[i].h, before: cloneAnn(sel) };
        this._lockChart(true);
        return;
      }
    }
    /**
     * TAP AWAY TO DESELECT. `_hitOwn` answers null anywhere off one of your own
     * drawings, so tapping empty chart clears the handles and the bin with them
     * — the selection is not a mode you have to find your way out of.
     */
    var own = this._hitOwn(pt);
    this.select(own ? own.id : null);
    // A long press on your own drawing offers to remove it. It is the gesture a
    // phone has for "and now do something to this thing", and it means the
    // delete does not depend on chrome being on screen.
    if (own) {
      var self = this;
      clearTimeout(this._pressTimer);
      this._pressTimer = setTimeout(function () {
        post({ type: 'draw.longPress', payload: { id: own.id } });
      }, 550);
    }
    return;
  }

  // --- creating a new one ---
  var price = this._price(pt.y);
  var time = this._time(pt.x);
  if (price == null || time == null) return;
  var id = 'draft:' + (++this._seq);
  this._draft =
    this.tool === 'level'
      ? { id: id, kind: 'support', price: round2(price), price2: null, ts_from: null, ts_to: null, text: 'Level', provenance: 'user', status: 'valid' }
      : this.tool === 'trendline'
        ? { id: id, kind: 'trendline', price: round2(price), price2: round2(price), ts_from: time, ts_to: time, text: 'Trendline', provenance: 'user', status: 'valid' }
        : { id: id, kind: 'zone', price: round2(price), price2: round2(price), ts_from: time, ts_to: null, text: 'Zone', provenance: 'user', status: 'valid' };
  this.c.annotations.add([this._draft]);
  this._lockChart(true);
};

DrawTool.prototype._move = function (e) {
  if (!this._from) return;
  var pt = this._at(e);
  if (Math.abs(pt.x - this._from.x) > 4 || Math.abs(pt.y - this._from.y) > 4) clearTimeout(this._pressTimer);

  if (this._grab) {
    var a = this._find(this._grab.id);
    if (!a) return;
    var p = this._price(pt.y);
    var t = this._time(pt.x);
    if (this._grab.handle === 'price' || this._grab.handle === 'top') { if (p != null) a.price = round2(p); }
    else if (this._grab.handle === 'bottom') { if (p != null) a.price2 = round2(p); }
    else if (this._grab.handle === 'from') {
      if (t != null) a.ts_from = t;
      if (p != null && a.kind === 'trendline') a.price = round2(p);
    } else if (this._grab.handle === 'to') {
      if (t != null) a.ts_to = t;
      if (p != null && a.kind === 'trendline') a.price2 = round2(p);
    }
    this.c.annotations.add([a]);
    return;
  }

  if (!this._draft) return;
  var pp = this._price(pt.y);
  var tt = this._time(pt.x);
  if (this._draft.kind === 'support') {
    if (pp != null) this._draft.price = round2(pp);
  } else if (this._draft.kind === 'trendline') {
    if (pp != null) this._draft.price2 = round2(pp);
    if (tt != null) this._draft.ts_to = tt;
  } else {
    if (pp != null) this._draft.price2 = round2(pp);
    // A drag that stayed in one column is a band, not a box: it is left OPEN at
    // the right so it runs to the live edge, which is what a supply or demand
    // area actually claims. Moving sideways is how you say "only this stretch".
    if (tt != null && Math.abs(pt.x - this._from.x) > DRAG_MIN * 3) this._draft.ts_to = tt;
  }
  this.c.annotations.add([this._draft]);
};

DrawTool.prototype._up = function (e) {
  clearTimeout(this._pressTimer);
  var pt = this._at(e);
  var moved = this._from ? Math.abs(pt.x - this._from.x) + Math.abs(pt.y - this._from.y) : 0;
  this._from = null;
  this._lockChart(false);

  if (this._grab) {
    var edited = this._find(this._grab.id);
    var g = this._grab;
    this._grab = null;
    if (edited) post({ type: 'draw.changed', payload: { annotation: cloneAnn(edited) } });
    return;
  }

  var d = this._draft;
  this._draft = null;
  if (!d) return;

  /**
   * A SHAPE THAT NEVER GOT A SECOND POINT IS NOT A SHAPE.
   *
   * A tap with the trendline tool would otherwise store a line from a bar to
   * itself — a dot claiming to be a trendline — and a tap with the zone tool a
   * rectangle with no height, which is a level wearing a box's clothes. Both are
   * dropped, and the tool stays out so the next attempt is just a drag.
   *
   * A LEVEL IS THE ONE THING A TAP CAN FINISH, because a horizontal line needs
   * one price and nothing else.
   */
  if (d.kind !== 'support' && moved < DRAG_MIN) {
    this.c.annotations.remove([d.id]);
    return;
  }
  if (d.kind === 'zone' && Math.abs(d.price - d.price2) < Math.max(0.01, Math.abs(d.price) * 0.0005)) {
    this.c.annotations.remove([d.id]);
    return;
  }
  if (d.kind === 'zone') {
    var hi = Math.max(d.price, d.price2);
    var lo = Math.min(d.price, d.price2);
    d.price = hi; d.price2 = lo;
  }
  post({ type: 'draw.created', payload: { annotation: cloneAnn(d) } });
  this.select(d.id);
  // One shape per pick-up. Leaving the tool armed is how a chart ends up with
  // five lines nobody meant to draw.
  this.setTool(null);
};

DrawTool.prototype._cancel = function () {
  clearTimeout(this._pressTimer);
  if (this._draft) this.c.annotations.remove([this._draft.id]);
  this._draft = null;
  this._grab = null;
  this._from = null;
  this._lockChart(false);
};

/** Hold the chart still for the duration of a drag that is not about the camera. */
DrawTool.prototype._lockChart = function (on) {
  if (this.tool) return;   // already locked for as long as the tool is out
  if (on && !this._editLock) {
    var o = this.c.chart.options();
    this._editLock = { handleScroll: o.handleScroll, handleScale: o.handleScale };
    this.c.chart.applyOptions({
      handleScroll: { mouseWheel: false, pressedMouseMove: false, horzTouchDrag: false, vertTouchDrag: false },
      handleScale: { axisPressedMouseMove: false, mouseWheel: false, pinch: false, axisDoubleClickReset: false },
    });
  } else if (!on && this._editLock) {
    this.c.chart.applyOptions(this._editLock);
    this._editLock = null;
  }
};

/* ------------------------------------------------------------------ */
/* Small shared geometry                                               */
/* ------------------------------------------------------------------ */

function round2(n) { return Math.round(n * 100) / 100; }

function cloneAnn(a) {
  return {
    id: a.id, kind: a.kind, price: a.price, price2: a.price2,
    ts_from: a.ts_from, ts_to: a.ts_to, text: a.text,
    provenance: a.provenance, status: a.status,
  };
}

/** Distance from a point to a segment — how a trendline is hit-tested. */
function distToSegment(p, a, b) {
  var dx = b.x - a.x, dy = b.y - a.y;
  var len = dx * dx + dy * dy;
  if (!len) return Math.hypot(p.x - a.x, p.y - a.y);
  var t = Math.max(0, Math.min(1, ((p.x - a.x) * dx + (p.y - a.y) * dy) / len));
  return Math.hypot(p.x - (a.x + t * dx), p.y - (a.y + t * dy));
}


/* ===== chart-web/src/06-chart.js ===== */
/**
 * The chart itself, and the camera Kai drives.
 *
 * EVERY CAMERA MOVE IS ONE OPERATION: setting the visible LOGICAL range.
 * Scroll, zoom, fit and "go to that candle" are all the same two numbers moving
 * — `{from, to}` in bar indices — which is why they can be eased with one tween
 * runner, interrupted at one place, and composed into a sequence without the
 * seams you get from mixing `scrollToPosition` with `applyOptions({barSpacing})`
 * with `setVisibleRange`. Bar spacing is a CONSEQUENCE (width / span), not an
 * input, so a zoom can never fight a scroll for the same frame.
 *
 * WHAT THE USER OWNS: `handleScroll` / `handleScale` / `kineticScroll` are the
 * library's own gesture stack — real momentum, real pinch, anchored on the pinch
 * centre. We do not reimplement any of it. The first touch on the glass cancels
 * whatever Kai was doing (see `_bindInterrupt`), which is the whole of rule 3 in
 * 02-motion.js applied to a chart.
 */

var LWC = window.LightweightCharts;

/** The rail, and the window each timeframe opens on. From the LIVE-1 brief. */
var TF_BARS = { D: 120, '4h': 120, '1h': 100, '15m': 96, '5m': 78, '1m': 90 };
var TF_ORDER = ['1m', '5m', '15m', '1h', '4h', 'D'];

function Chart(root) {
  var self = this;
  this.root = root;
  this.bars = [];               // normalized {time, open, high, low, close, value}
  this.timeframe = 'D';
  this.symbol = '';
  this.lastPrice = null;
  this.volumeOn = false;
  this._seq = 0;
  this._readyPosted = false;
  this._userTouching = false;

  var host = document.createElement('div');
  host.className = 'chart-host';
  root.appendChild(host);
  this.host = host;

  this.chart = LWC.createChart(host, {
    layout: {
      background: { type: 'solid', color: TOKENS.bg },
      textColor: TOKENS.dim,
      fontSize: 10,
      fontFamily: '"Geist Mono", ui-monospace, "SF Mono", Menlo, monospace',
      attributionLogo: false,
    },
    grid: {
      vertLines: { color: TOKENS.grid },
      horzLines: { color: TOKENS.grid },
    },
    crosshair: {
      mode: LWC.CrosshairMode.Normal,
      vertLine: { color: withAlpha(TOKENS.text, 0.28), width: 1, style: 3, labelBackgroundColor: TOKENS.surface },
      horzLine: { color: withAlpha(TOKENS.text, 0.28), width: 1, style: 3, labelBackgroundColor: TOKENS.surface },
    },
    rightPriceScale: {
      borderColor: TOKENS.hairline,
      scaleMargins: { top: 0.12, bottom: 0.14 },
      entireTextOnly: true,
    },
    leftPriceScale: { visible: false },
    timeScale: {
      borderColor: TOKENS.hairline,
      rightOffset: 4,
      barSpacing: 6,
      minBarSpacing: 0.6,
      timeVisible: true,
      secondsVisible: false,
      lockVisibleTimeRangeOnResize: true,
    },
    // The brokerage gesture set, EMBEDDED. Vertical touch-drag is off because
    // the chart sits inside a scrolling page here: a finger moving down the
    // glass belongs to the page, and a chart that grabbed it would make the
    // screen impossible to scroll past.
    //
    // That is a property of being embedded, not of the chart, so the stage
    // turns it back on the moment the chart owns the whole screen — see
    // `setGestures`. It is the whole reason "I can't scroll vertically" was
    // true: nothing was broken, the chart was being a good citizen in a page
    // that no longer exists once you expand it.
    handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
    handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true, axisDoubleClickReset: true },
    kineticScroll: { touch: true, mouse: false },
    autoSize: true,
    localization: {
      priceFormatter: function (p) { return fmtPrice(p); },
    },
  });

  this.series = this.chart.addSeries(LWC.CandlestickSeries, {
    upColor: TOKENS.green,
    downColor: TOKENS.red,
    borderVisible: false,
    wickUpColor: TOKENS.green,
    wickDownColor: TOKENS.red,
    priceLineVisible: true,
    // The last price is MARKET data, so it is cyan. Palette lock 14 reserves
    // volt for user actions; a volt price line would be the app claiming
    // authorship of the tape.
    priceLineColor: withAlpha(TOKENS.cyan, 0.6),
    priceLineWidth: 1,
    priceLineStyle: 2,
    lastValueVisible: true,
    priceFormat: { type: 'price', precision: 2, minMove: 0.01 },
  });

  // Volume rides on its own invisible scale pinned to the bottom 16%, so it can
  // be switched on later (LIVE-1b) without the candles ever moving.
  this.volume = this.chart.addSeries(LWC.HistogramSeries, {
    priceScaleId: 'vol',
    priceFormat: { type: 'volume' },
    color: withAlpha(TOKENS.cyan, 0.14),
    lastValueVisible: false,
    priceLineVisible: false,
    visible: false,
  });
  this.chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.86, bottom: 0 } });

  this.owns = false;
  this.autoScaleOn = true;

  this.session = new SessionShading();
  this.series.attachPrimitive(this.session);
  this.annotations = new AnnotationLayer();
  this.series.attachPrimitive(this.annotations);

  // Drawing by hand. Constructed last, so it binds its pointer handlers AFTER
  // the chart's own — a tool that is out gets the gesture, and when none is out
  // its handlers fall through to the camera exactly as before.
  this.draw = new DrawTool(this);

  this.rail = new TimeframeRail(root, function (tf, who) { self._railPick(tf, who); });
  this.rail.setOptions(TF_ORDER, this.timeframe);
  this.pointer = new KaiPointer(root);

  this.legend = document.createElement('div');
  this.legend.className = 'ohlc';
  root.appendChild(this.legend);

  this.veil = document.createElement('div');
  this.veil.className = 'veil';
  root.appendChild(this.veil);

  /**
   * The way back to autoscale. Hidden until there is something to go back FROM,
   * because a control that is always visible and almost never useful is just
   * another thing in front of the chart.
   */
  this.autoBtn = document.createElement('button');
  this.autoBtn.className = 'autoscale';
  this.autoBtn.type = 'button';
  this.autoBtn.textContent = 'Auto';
  this.autoBtn.setAttribute('aria-label', 'Fit the price scale to the bars again');
  this.autoBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    self.setAutoScale(true);
    // Re-fit where the user can SEE it happen. Under reduced motion it is
    // instant, which is the same promise kept a different way.
    self.fitDefault(reducedMotion() ? 0 : 260);
  });
  root.appendChild(this.autoBtn);

  this.empty = document.createElement('div');
  this.empty.className = 'empty';
  this.empty.textContent = 'No price bars for this timeframe yet. The levels are still real.';
  root.appendChild(this.empty);

  this._bindInterrupt();
  this._bindCrosshair();
  this._bindTaps();
  this._measureChrome();
  window.addEventListener('resize', function () { self._measureChrome(); });

  this.chart.timeScale().subscribeVisibleLogicalRangeChange(function () { self._postViewport(); });
}

/* ------------------------------------------------------------------ */
/* User input owns the camera the instant it arrives                   */
/* ------------------------------------------------------------------ */

Chart.prototype._bindInterrupt = function () {
  var self = this;
  var grab = function () {
    self._userTouching = true;
    // Not "queue the user behind Kai" and not "let both move it". The finger
    // wins, from wherever the tween had reached, and the host is told so it can
    // abandon the rest of the sequence instead of talking over the user.
    if (Motion.busy()) {
      Motion.cancel('interrupted');
      self.pointer.hide();
    }
  };
  var release = function () { self._userTouching = false; };

  /**
   * A vertical drag on the stage is the user claiming the price axis.
   *
   * Only when the chart OWNS the screen — embedded, a vertical finger belongs
   * to the page — and only when the movement is actually vertical, so a
   * slightly wonky horizontal scroll does not silently switch the scale to
   * manual and leave the next level Kai draws off the pane.
   */
  var startY = null;
  var startX = null;
  var onStart = function (e) {
    var t = e.touches && e.touches[0];
    startY = t ? t.clientY : e.clientY;
    startX = t ? t.clientX : e.clientX;
  };
  var onMove = function (e) {
    if (!self.owns || startY == null || !self.autoScaleOn) return;
    var t = e.touches && e.touches[0];
    var y = t ? t.clientY : e.clientY;
    var x = t ? t.clientX : e.clientX;
    if (Math.abs(y - startY) > 12 && Math.abs(y - startY) > Math.abs(x - startX)) {
      self.setAutoScale(false);
    }
  };
  /**
   * A FINGER ON THE PRICE SIDEBAR SCALES THE PRICE, EVEN INSIDE A PAGE.
   *
   * `vertTouchDrag` is a whole-chart option, and Lightweight Charts uses it for
   * the price axis as well as for the plot: with it off, a vertical touch on the
   * axis is treated as page scroll and thrown away. That is right for the PLOT
   * when the chart is embedded — the page needs that finger — and wrong for the
   * AXIS, which nobody drags by accident. Measured before this: dragging the
   * price sidebar with a finger in the Trade Portal moved nothing, while the
   * same drag with a mouse worked and the same finger worked once the chart was
   * expanded. One whole gesture missing, on the surface most people use.
   *
   * So the flag is flipped for the DURATION OF A TOUCH THAT STARTED ON THE AXIS
   * and put back the moment it ends. The plot never sees it on, because a touch
   * that started on the plot never turns it on. Which surface was touched is
   * decided by the axis's own reported width rather than by reaching into the
   * library's DOM, so it cannot drift when the library re-renders.
   */
  var axisTouch = false;
  var onAxis = function (clientX) {
    var r = self.host.getBoundingClientRect();
    var axisW = 0;
    try { axisW = self.chart.priceScale('right').width(); } catch (e) { axisW = 0; }
    return axisW > 0 && clientX - r.left >= r.width - axisW - 2;
  };
  this.host.addEventListener('touchstart', function (e) {
    var t = e.touches && e.touches[0];
    if (!t || !onAxis(t.clientX)) return;
    axisTouch = true;
    self.chart.applyOptions({ handleScroll: { vertTouchDrag: true } });
  }, { capture: true, passive: true });
  var endAxisTouch = function () {
    if (!axisTouch) return;
    axisTouch = false;
    self.chart.applyOptions({ handleScroll: { vertTouchDrag: !!self.owns } });
  };
  this.host.addEventListener('touchend', endAxisTouch, { capture: true, passive: true });
  this.host.addEventListener('touchcancel', endAxisTouch, { capture: true, passive: true });

  /**
   * SCALING THE AXIS BY HAND MAKES THE RANGE YOURS.
   *
   * Autoscale and a manual range are the same control and only one can win (see
   * `setAutoScale`). While autoscale is on, the annotation layer's own
   * `autoscaleInfo` re-derives the range every frame, so a drag that is not
   * followed by this would be undone before the finger left the glass.
   *
   * A TAP IS NOT A DRAG. Six pixels of movement, so touching the axis to read a
   * number does not silently take the chart off autoscale — which would be a
   * mode change nobody asked for and nobody saw.
   */
  var axisFrom = null;
  var axisDown = function (e) {
    var t = (e.touches && e.touches[0]) || e;
    if (t.clientX == null || !onAxis(t.clientX)) { axisFrom = null; return; }
    axisFrom = t.clientY;
  };
  var axisUp = function (e) {
    if (axisFrom == null) return;
    var t = (e.changedTouches && e.changedTouches[0]) || e;
    var moved = t.clientY == null ? 0 : Math.abs(t.clientY - axisFrom);
    axisFrom = null;
    if (moved > 6) self.setAutoScale(false);
  };
  this.host.addEventListener('touchstart', axisDown, { passive: true });
  this.host.addEventListener('pointerdown', axisDown, { passive: true });
  this.host.addEventListener('touchend', axisUp, { passive: true });
  this.host.addEventListener('pointerup', axisUp, { passive: true });

  this.host.addEventListener('touchstart', onStart, { passive: true });
  this.host.addEventListener('pointerdown', onStart, { passive: true });
  this.host.addEventListener('touchmove', onMove, { passive: true });
  this.host.addEventListener('pointermove', onMove, { passive: true });
  this.host.addEventListener('pointerdown', grab, { passive: true });
  this.host.addEventListener('touchstart', grab, { passive: true });
  this.host.addEventListener('wheel', grab, { passive: true });
  this.host.addEventListener('pointerup', release, { passive: true });
  this.host.addEventListener('touchend', release, { passive: true });
};

/* ------------------------------------------------------------------ */
/* Crosshair readout                                                   */
/* ------------------------------------------------------------------ */

Chart.prototype._bindCrosshair = function () {
  var self = this;
  this.chart.subscribeCrosshairMove(function (param) {
    if (!param || !param.time || !param.point) { self._clearLegend(); return; }
    var d = param.seriesData.get(self.series);
    if (!d) { self._clearLegend(); return; }
    var up = d.close >= d.open;
    var col = up ? TOKENS.green : TOKENS.red;
    var chg = d.open ? ((d.close - d.open) / d.open) * 100 : 0;
    self.legend.innerHTML =
      '<span class="ohlc-t">' + fmtTime(param.time, self.timeframe) + '</span>' +
      '<span class="ohlc-k">O</span><span>' + fmtPrice(d.open) + '</span>' +
      '<span class="ohlc-k">H</span><span>' + fmtPrice(d.high) + '</span>' +
      '<span class="ohlc-k">L</span><span>' + fmtPrice(d.low) + '</span>' +
      '<span class="ohlc-k">C</span><span style="color:' + col + '">' + fmtPrice(d.close) + '</span>' +
      '<span style="color:' + col + '">' + (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%</span>';
    self.legend.classList.add('is-on');
    post({ type: 'crosshair', payload: { time: param.time, open: d.open, high: d.high, low: d.low, close: d.close } });
  });
};

Chart.prototype._clearLegend = function () {
  if (!this.legend.classList.contains('is-on')) return;
  this.legend.classList.remove('is-on');
  post({ type: 'crosshairEnd', payload: {} });
};

/* ------------------------------------------------------------------ */
/* Taps: annotation chips, and double-tap to reset                     */
/* ------------------------------------------------------------------ */

Chart.prototype._bindTaps = function () {
  var self = this;
  var lastTap = 0;
  this.host.addEventListener('pointerup', function (e) {
    var r = self.host.getBoundingClientRect();
    var x = e.clientX - r.left;
    var y = e.clientY - r.top;

    var id = self.annotations.hitTest(x, y);
    // The overflow chip is a control, not a mark. It belongs to the chart, so
    // tapping it neither flashes an annotation nor tells the host that one was
    // selected — it just shows the levels the budget folded away.
    if (id === OVERFLOW_ID) {
      self.annotations.toggleOverflow();
      lastTap = 0;
      return;
    }
    // The bin on the selected drawing. Belongs to the drawing, not to the
    // chart, so it goes to the tool that owns selection rather than to the host.
    if (id === TRASH_ID) {
      self.draw.deleteSelected();
      lastTap = 0;
      return;
    }
    if (id) {
      self.annotations.flash(id, 1);
      post({ type: 'annotationTap', payload: { id: id } });
      lastTap = 0;
      return;
    }
    var now = Date.now();
    if (now - lastTap < 280) {
      // Double-tap is "put it back the way it was", the same promise as
      // double-tapping a photo back to fit. Not a zoom step.
      lastTap = 0;
      self.fitDefault(reducedMotion() ? 0 : 320);
    } else {
      lastTap = now;
    }
  });
};

/* ------------------------------------------------------------------ */
/* Data                                                                */
/* ------------------------------------------------------------------ */

Chart.prototype.setData = function (p) {
  // The brief's budget is "first paint < 400ms after mount with 1,500 bars", so
  // the thing measured has to be the whole job: normalise, sort, hand to the
  // series, shade the session, frame the window — and then wait for the frame
  // that actually shows it. A number taken before the rAF is a number about
  // parsing, not about painting.
  var t0 = (window.performance || Date).now();
  var raw = p.candles || [];
  var bars = [];
  var vols = [];
  for (var i = 0; i < raw.length; i++) {
    var c = raw[i];
    var t = typeof c.t === 'number' ? c.t : Math.floor(Date.parse(c.t) / 1000);
    if (!isFinite(t)) continue;
    var bar = { time: t, open: +c.o, high: +c.h, low: +c.l, close: +c.c };
    // Per-bar colour hook. Nothing sets it in LIVE-1; the RSI heatmap in LIVE-1b
    // sets `color`/`wickColor` per bar and this chart needs no change at all.
    if (c.color) { bar.color = c.color; bar.wickColor = c.wickColor || c.color; bar.borderColor = c.color; }
    bars.push(bar);
    vols.push({ time: t, value: +(c.v || 0), color: withAlpha(bar.close >= bar.open ? TOKENS.green : TOKENS.red, 0.16) });
  }
  bars.sort(function (a, b) { return a.time - b.time; });
  vols.sort(function (a, b) { return a.time - b.time; });

  var wasEmpty = this.bars.length === 0;
  this.bars = bars;
  this.symbol = p.symbol || this.symbol;
  if (p.timeframe) { this.timeframe = p.timeframe; this.rail.setValue(p.timeframe); }
  this.lastPrice = p.lastPrice == null ? (bars.length ? bars[bars.length - 1].close : null) : p.lastPrice;

  this.series.setData(bars);
  this.volume.setData(vols);
  this.session.setBars(bars, this.timeframe);
  // VOLUME AND THE LAST PRICE GO WITH THE BARS. VWAP is computed on this page
  // from the volume, and the horizontal-line budget picks the levels nearest to
  // price when it has to choose which ones to draw.
  this.annotations.setBars(bars, vols.map(function (v) { return v.value; }), this.lastPrice);
  this.empty.classList.toggle('is-on', bars.length === 0);

  if (wasEmpty || p.resetView !== false) this.fitDefault(0);
  this._lower();
  this._postViewport();

  requestAnimationFrame(function () {
    post({
      type: 'painted',
      payload: { ms: Math.round(((window.performance || Date).now()) - t0), bars: bars.length },
    });
  });
};

/**
 * Hand the chart its full gesture set, or take it back.
 *
 * `own: true` is the chart on its own screen: vertical drag pans the price
 * axis, and a pinch scales both axes from the pinch centre. `own: false` is the
 * embedded chart inside a scrolling page, where the vertical axis belongs to
 * the page.
 *
 * The price scale's own autoscale is switched off while the user is panning it
 * by hand, because an autoscale that keeps re-fitting under a finger is a chart
 * fighting the person holding it. It comes back on `own: false`, and the double
 * tap on the axis restores it at any time.
 */
Chart.prototype.setGestures = function (own) {
  this.owns = !!own;
  this.chart.applyOptions({
    handleScroll: {
      mouseWheel: true,
      pressedMouseMove: true,
      horzTouchDrag: true,
      vertTouchDrag: !!own,
    },
    handleScale: {
      /**
       * THE PRICE SIDEBAR ALWAYS TAKES A DRAG, EMBEDDED OR NOT.
       *
       * It used to be handed `true` when embedded, which enables the MOUSE and
       * leaves touch to the pane's own `vertTouchDrag` — and that is off when
       * the chart is inside a scrolling page. Measured: dragging the price axis
       * with a finger in the Trade Portal moved nothing at all, while the same
       * drag with a mouse worked, and the same finger worked once the chart was
       * expanded. That is exactly the owner's report, and it is a whole gesture
       * missing on the surface most people use.
       *
       * The object form asks for both pointer types explicitly. It is also the
       * right call on the merits: a finger on the PLOT is ambiguous when the
       * chart sits in a scrolling page — the page probably wants it — but a
       * finger on the price axis is not ambiguous at all. Nobody drags a price
       * scale by accident.
       */
      axisPressedMouseMove: { time: true, price: true },
      mouseWheel: true,
      pinch: true,
      axisDoubleClickReset: true,
    },
  });
  // Leaving the stage hands the vertical axis back to autoscale, so the
  // embedded chart is never left holding a range the user panned to on a
  // screen they have since closed.
  if (!own) this.setAutoScale(true);
};

/**
 * AUTOSCALE AND MANUAL PANNING ARE THE SAME CONTROL, AND ONLY ONE CAN WIN.
 *
 * `vertTouchDrag` alone does nothing while the price scale is auto-fitting:
 * the scale re-derives its range from the visible bars every frame, so a
 * finger drags the chart and the next frame puts it straight back. Measured —
 * the axis did not move by a pixel. Whoever set `vertTouchDrag` first was not
 * wrong, just incomplete, which is why "I can't scroll vertically" survived a
 * flag that looks like it fixes it.
 *
 * SO THE RULE IS WHOSE RANGE IT IS. Autoscale on means the CHART decides, and
 * that is what has to be true when Kai draws — it is the only reason a level
 * he marks is guaranteed to be on screen (see `autoscaleInfo`). The moment the
 * user drags the axis, it becomes THEIRS: autoscale off, their range stands,
 * and it keeps standing until they double-tap the axis or Kai starts talking
 * again. A chart that silently re-fits under someone's finger is a chart
 * arguing with them.
 */
Chart.prototype.setAutoScale = function (on) {
  this.autoScaleOn = !!on;
  this.chart.priceScale('right').applyOptions({ autoScale: !!on });
  /**
   * A MODE THE USER CANNOT SEE IS A MODE THEY ARE STUCK IN.
   *
   * Taking the price scale off autoscale is the right thing to do the moment
   * someone drags it — but nothing on screen said so, and nothing offered a way
   * back. The way out was a double-tap that only someone who already knew would
   * try. So the state gets a chip: it appears only while the range is manual,
   * it says what it does, and one tap gives the chart its scale back and re-fits
   * in front of you rather than snapping silently.
   */
  if (this.autoBtn) this.autoBtn.classList.toggle('is-on', !on);
};

/**
 * Broadcast mode: the chart's own furniture gets out of the way.
 *
 * Only the timeframe rail lives inside this page, so only it is hidden here.
 * The rail is a CONTROL, and a control sitting on screen while Kai is talking
 * invites a tap that would interrupt him — the point of the mode is that there
 * is nothing to do but watch. Everything else about the chart is unchanged: the
 * candles, the levels and the pointer are the show, not chrome.
 */
Chart.prototype.setBroadcast = function (on) {
  this.broadcast = !!on;
  // Kai is about to draw. Give the scale back to the chart so everything he
  // marks is inside the pane, even if the user had panned away from it.
  if (on) this.setAutoScale(true);
  if (this.rail && this.rail.el) {
    this.rail.el.style.transition = 'opacity 260ms ease, transform 260ms ease';
    this.rail.el.style.opacity = on ? '0' : '1';
    this.rail.el.style.transform = on ? 'translateY(6px)' : 'translateY(0)';
    this.rail.el.style.pointerEvents = on ? 'none' : 'auto';
  }
};

/** Replace or append the newest bar without touching the camera. */
Chart.prototype.updateLast = function (c) {
  if (!c) return;
  var t = typeof c.t === 'number' ? c.t : Math.floor(Date.parse(c.t) / 1000);
  if (!isFinite(t)) return;
  var bar = { time: t, open: +c.o, high: +c.h, low: +c.l, close: +c.c };
  this.series.update(bar);
  if (this.bars.length && this.bars[this.bars.length - 1].time === t) this.bars[this.bars.length - 1] = bar;
  else this.bars.push(bar);
  this.lastPrice = bar.close;
  // Which levels are nearest has just changed, and the budget chooses by that.
  this.annotations.setLastPrice(bar.close);
};

Chart.prototype.setVolume = function (on) {
  this.volumeOn = !!on;
  this.volume.applyOptions({ visible: this.volumeOn });
};

/* ------------------------------------------------------------------ */
/* Camera                                                              */
/* ------------------------------------------------------------------ */

Chart.prototype._range = function () {
  var r = this.chart.timeScale().getVisibleLogicalRange();
  if (r) return { from: r.from, to: r.to };
  var n = this.bars.length || 1;
  return { from: Math.max(0, n - 100), to: n + 4 };
};

Chart.prototype._setRange = function (from, to) {
  if (!(to > from)) return;
  this.chart.timeScale().setVisibleLogicalRange({ from: from, to: to });
};

/**
 * The one tween every camera command funnels into: move `{from,to}` from where
 * it IS to where it should be. Interrupting reads the live value, so a cancelled
 * move leaves the chart exactly where the finger caught it.
 */
Chart.prototype._glide = function (target, duration, ease, id) {
  var self = this;
  var start = this._range();
  var f0 = start.from, t0 = start.to;
  var f1 = target.from, t1 = target.to;
  Motion.run({
    duration: duration,
    ease: ease || 'scroll',
    onStep: function (p) { self._setRange(f0 + (f1 - f0) * p, t0 + (t1 - t0) * p); },
    onDone: function (reason) { done(id, reason); },
  });
};

/** Index of the bar at (or nearest before) a timestamp. -1 when there is none. */
Chart.prototype._indexOf = function (time) {
  var t = typeof time === 'number' ? time : Math.floor(Date.parse(time) / 1000);
  if (!isFinite(t) || !this.bars.length) return -1;
  var best = -1;
  for (var i = 0; i < this.bars.length; i++) {
    if (this.bars[i].time <= t) best = i; else break;
  }
  return best === -1 ? 0 : best;
};

Chart.prototype.scrollByBars = function (bars, duration, id) {
  var r = this._range();
  this._glide({ from: r.from + bars, to: r.to + bars }, duration, 'scroll', id);
};

Chart.prototype.scrollToTime = function (time, align, duration, id) {
  var idx = this._indexOf(time);
  if (idx < 0) return done(id, 'done');
  var r = this._range();
  var span = r.to - r.from;
  // 0.62 rather than 0.5: the eye reads a chart left to right, so the candle
  // being discussed wants MORE history behind it than empty space ahead of it.
  var frac = align === 'right' ? 0.9 : align === 'left' ? 0.2 : 0.62;
  var from = idx - span * frac;
  this._glide({ from: from, to: from + span }, duration, 'scroll', id);
};

Chart.prototype.scrollToNow = function (duration, id) {
  var r = this._range();
  var span = r.to - r.from;
  var to = this.bars.length + 4;
  this._glide({ from: to - span, to: to }, duration, 'scroll', id);
};

Chart.prototype.zoomTo = function (barSpacing, anchorTime, duration, id) {
  var W = this.host.clientWidth || 320;
  var span = Math.max(6, W / Math.max(0.6, barSpacing));
  var r = this._range();
  var anchorIdx = anchorTime != null ? this._indexOf(anchorTime) : (r.from + r.to) / 2;
  // Keep the anchor bar at the same fraction of the width it already occupies,
  // so a zoom around a candle rotates the view about that candle instead of
  // sliding it sideways while the scale changes.
  var frac = Math.max(0.05, Math.min(0.95, (anchorIdx - r.from) / Math.max(1, r.to - r.from)));
  var from = anchorIdx - span * frac;
  this._glide({ from: from, to: from + span }, duration, 'zoom', id);
};

Chart.prototype.zoomToRange = function (t1, t2, padding, duration, id) {
  var a = this._indexOf(t1), b = this._indexOf(t2);
  if (a < 0 || b < 0) return done(id, 'done');
  var lo = Math.min(a, b), hi = Math.max(a, b);
  var pad = padding == null ? 0.12 : padding;
  var span = Math.max(8, hi - lo);
  this._glide({ from: lo - span * pad, to: hi + span * pad }, duration, 'zoom', id);
};

/** The timeframe's own default window (brief: D 120 · 4h 120 · 1h 100 · 15m 96 · 5m 78 · 1m 90). */
Chart.prototype.fitDefault = function (duration, id) {
  var want = TF_BARS[this.timeframe] || 100;
  var n = this.bars.length;
  var to = n + 4;
  var from = Math.max(-2, to - Math.min(want, Math.max(20, n)) - 4);
  if (!duration) { this._setRange(from, to); return done(id, 'done'); }
  this._glide({ from: from, to: to }, duration, 'zoom', id);
};

/* ------------------------------------------------------------------ */
/* Timeframe: the button presses, then the chart crossfades            */
/* ------------------------------------------------------------------ */

Chart.prototype._railPick = function (tf, who) {
  if (tf === this.timeframe) return;
  this.rail.setValue(tf);
  this.timeframe = tf;
  this.crossfadeIn();
  post({ type: 'timeframe', payload: { timeframe: tf, by: who || 'user' } });
};

/** Veil up. It comes back down when the new bars land (or after a beat, if the
 *  host has nothing new to send). Never a hard cut between two price series. */
Chart.prototype.crossfadeIn = function () {
  var self = this;
  if (reducedMotion()) return;
  this.veil.classList.add('is-on');
  clearTimeout(this._veilT);
  this._veilT = setTimeout(function () { self.veil.classList.remove('is-on'); }, 900);
};

Chart.prototype._lower = function () {
  var self = this;
  clearTimeout(this._veilT);
  // One frame of the new data on screen before the veil lifts, so the fade
  // reveals the new chart rather than dissolving into an empty one.
  requestAnimationFrame(function () { self.veil.classList.remove('is-on'); });
};

Chart.prototype.setTimeframe = function (tf, id) {
  if (!TF_BARS[tf]) return done(id, 'done');
  // The host re-asserts the timeframe whenever its own state settles, which is
  // correct and would otherwise crossfade a chart that never changed. Switching
  // to what is already on screen is a no-op, not a transition.
  if (tf === this.timeframe) return done(id, 'done');
  this.rail.setValue(tf);
  this.timeframe = tf;
  this.session.setBars(this.bars, tf);
  this.crossfadeIn();
  post({ type: 'timeframe', payload: { timeframe: tf, by: 'kai' } });
  done(id, 'done');
};

/* ------------------------------------------------------------------ */
/* Pointer, in chart coordinates                                       */
/* ------------------------------------------------------------------ */

Chart.prototype.rootRect = function () { return this.root.getBoundingClientRect(); };

/**
 * Where the floating rail sits, in PLOT coordinates, so annotation chips can
 * step around it. Measured once and on resize — reading layout every frame
 * would force a reflow inside the render loop.
 */
Chart.prototype._measureChrome = function () {
  var r = this.rail.el.getBoundingClientRect();
  var h = this.host.getBoundingClientRect();
  this.annotations.setAvoid({ x: r.left - h.left, y: r.top - h.top, w: r.width, h: r.height });
};

/** Resolve {x|time, y|price} into page coordinates inside the chart surface. */
Chart.prototype.resolvePoint = function (p) {
  var hostRect = this.host.getBoundingClientRect();
  var rootRect = this.rootRect();
  var dx = hostRect.left - rootRect.left;
  var dy = hostRect.top - rootRect.top;
  var x, y;

  if (p.rail) {
    var c = this.rail.centerOf(p.rail, rootRect);
    if (c) return c;
  }
  if (p.time != null) {
    var cx = this.chart.timeScale().timeToCoordinate(
      typeof p.time === 'number' ? p.time : Math.floor(Date.parse(p.time) / 1000)
    );
    x = cx == null ? this.host.clientWidth * 0.62 : cx;
  } else if (p.x != null) {
    x = p.x <= 1 ? this.host.clientWidth * p.x : p.x;
  } else {
    x = this.host.clientWidth * 0.62;
  }
  if (p.price != null) {
    var cy = this.series.priceToCoordinate(p.price);
    y = cy == null ? this.host.clientHeight * 0.5 : cy;
  } else if (p.y != null) {
    y = p.y <= 1 ? this.host.clientHeight * p.y : p.y;
  } else {
    y = this.host.clientHeight * 0.5;
  }
  return { x: x + dx, y: y + dy };
};

/* ------------------------------------------------------------------ */
/* Viewport reporting                                                  */
/* ------------------------------------------------------------------ */

Chart.prototype._postViewport = function () {
  var r = this.chart.timeScale().getVisibleLogicalRange();
  if (!r) return;
  var W = this.host.clientWidth || 1;
  post({
    type: 'viewport',
    payload: {
      from: r.from, to: r.to,
      barSpacing: W / Math.max(1, r.to - r.from),
      firstTime: this.bars.length ? this.bars[Math.max(0, Math.min(this.bars.length - 1, Math.round(r.from)))].time : null,
      lastTime: this.bars.length ? this.bars[Math.max(0, Math.min(this.bars.length - 1, Math.round(r.to)))].time : null,
    },
  });
};

function fmtTime(t, tf) {
  var d = new Date((typeof t === 'number' ? t : Date.parse(t) / 1000) * 1000);
  if (tf === 'D') return d.toISOString().slice(0, 10);
  try {
    return new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/New_York', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
    }).format(d);
  } catch (e) { return d.toISOString().slice(5, 16).replace('T', ' '); }
}


/* ===== chart-web/src/07-bridge.js ===== */
/**
 * The bridge. One message shape in both directions, one transport per platform.
 *
 *   native  →  window.ReactNativeWebView.postMessage(json)
 *   web     →  window.parent.postMessage(obj, '*')     (iframe, same origin)
 *
 * EVERY HOST COMMAND CARRIES AN `id`, AND EVERY CAMERA COMMAND ANSWERS WITH
 * `done{id, reason}`. That is not bookkeeping — it is what lets a choreography
 * be a SEQUENCE rather than a pile of setTimeouts. Step 3 starts when step 2
 * actually finished, on this device, at this frame rate; and when the user
 * grabs the chart mid-move, step 2 answers `interrupted` and the rest of the
 * sequence is abandoned instead of talking over them.
 *
 * The page never fetches. No `<script src>`, no XHR, no websocket: data and
 * commands arrive over this channel and nowhere else. A chart that can reach the
 * network is a chart that can show a number nobody in the app can account for.
 */

var NATIVE = !!(window.ReactNativeWebView && window.ReactNativeWebView.postMessage);

function post(msg) {
  try {
    if (NATIVE) window.ReactNativeWebView.postMessage(JSON.stringify(msg));
    else if (window.parent && window.parent !== window) window.parent.postMessage(msg, '*');
  } catch (e) { /* a dead bridge must not take the chart down with it */ }
}

/** Resolve one host command. `reason` is 'done' | 'interrupted' | 'superseded'. */
function done(id, reason) {
  if (id == null) return;
  post({ type: 'done', id: id, payload: { reason: reason || 'done' } });
}

var CHART = null;

function handle(msg) {
  if (!msg || typeof msg !== 'object') return;
  var id = msg.id;
  var p = msg.payload || {};
  var c = CHART;
  if (!c) return;

  try {
    switch (msg.type) {
      case 'ping': return done(id, 'done');

      case 'setTheme': {
        for (var k in p.tokens || {}) {
          if (Object.prototype.hasOwnProperty.call(p.tokens, k)) TOKENS[k] = p.tokens[k];
        }
        return done(id, 'done');
      }

      case 'setReducedMotion': setReducedMotion(p.on); return done(id, 'done');
      // The chart owns the screen (the stage) or is embedded in a page.
      case 'setGestures': c.setGestures(p.own); return done(id, 'done');
      // Kai is talking; the chart's own controls step back.
      case 'setBroadcast': c.setBroadcast(p.on); return done(id, 'done');
      case 'setVolume': c.setVolume(p.on); return done(id, 'done');
      case 'setData': c.setData(p); return done(id, 'done');
      case 'updateLast': c.updateLast(p.candle || p); return done(id, 'done');
      case 'setTimeframe': return c.setTimeframe(p.timeframe || p.tf, id);

      /* -------- camera -------- */
      case 'camera.scrollByBars': return c.scrollByBars(p.bars || 0, dur(p), id);
      case 'camera.scrollToTime': return c.scrollToTime(p.time, p.align, dur(p), id);
      case 'camera.scrollToNow': return c.scrollToNow(dur(p), id);
      case 'camera.zoomTo': return c.zoomTo(p.barSpacing, p.anchorTime, dur(p), id);
      case 'camera.zoomToRange': return c.zoomToRange(p.from, p.to, p.padding, dur(p), id);
      case 'camera.fit': return c.fitDefault(dur(p), id);
      case 'camera.cancel': Motion.cancel('superseded'); return done(id, 'done');

      /* -------- annotations -------- */
      case 'annotations.set': c.annotations.set(p.annotations || []); return done(id, 'done');
      case 'annotations.add': c.annotations.add(p.annotations || []); return done(id, 'done');
      case 'annotations.remove': c.annotations.remove(p.ids || []); return done(id, 'done');
      case 'annotations.flash': c.annotations.flash(p.id, p.pulses); return done(id, 'done');
      case 'annotations.hidden': c.annotations.setHidden(p.on); return done(id, 'done');

      /* -------- drawing by hand -------- */
      //
      // The host owns the TRAY; the page owns the GESTURE. Everything the user
      // draws comes back up as `draw.created` / `draw.changed` / `draw.deleted`
      // for the host to persist through the annotations API, because this page
      // has no network and must not grow one.
      case 'draw.setTool': c.draw.setTool(p.tool); return done(id, 'done');
      case 'draw.select': c.draw.select(p.id || null); return done(id, 'done');
      case 'draw.deleteSelected': c.draw.deleteSelected(); return done(id, 'done');

      /* -------- Kai's pointer -------- */
      case 'pointer.moveTo': {
        var pt = c.resolvePoint(p);
        return c.pointer.moveTo(pt.x, pt.y, dur(p, 380), function (reason) { done(id, reason); });
      }
      case 'pointer.press': {
        // Pressing a rail button is a press ON SOMETHING: the button has to look
        // pressed too, or the pointer is miming.
        if (p.rail) return c.rail.pressVisual(p.rail, function () { c.pointer.press(function () { done(id, 'done'); }); });
        return c.pointer.press(function () { done(id, 'done'); });
      }
      case 'pointer.hide': c.pointer.hide(); return done(id, 'done');
      case 'pointer.show': c.pointer.show(); return done(id, 'done');

      default:
        return post({ type: 'error', id: id, payload: { message: 'Unknown chart command: ' + msg.type } });
    }
  } catch (e) {
    post({ type: 'error', id: id, payload: { message: String((e && e.message) || e) } });
    done(id, 'done');
  }
}

/** Durations are jittered ±10% here, once, so every caller inherits it. */
function dur(p, fallback) {
  var d = p.duration == null ? (fallback == null ? 420 : fallback) : p.duration;
  return p.jitter === false ? d : jitter(d);
}

function receive(ev) {
  var data = ev && ev.data;
  if (typeof data === 'string') {
    try { data = JSON.parse(data); } catch (e) { return; }
  }
  handle(data);
}

window.addEventListener('message', receive);
// react-native-webview delivers injected messages on `document` on Android and
// on `window` on iOS. Listening to both is the whole of the platform difference.
document.addEventListener('message', receive);


/* ===== chart-web/src/08-boot.js ===== */
/**
 * Boot.
 *
 * NO WHITE FLASH: the document is painted `#0C0C0F` by the stylesheet before a
 * line of this runs, and the WebView itself is given the same colour, so the
 * three moments that used to flash white (WebView creation, first paint, chart
 * canvas insertion) are all already the surface colour.
 *
 * FIRST PAINT IS MEASURED, NOT ASSUMED. `firstPaintMs` is reported to the host
 * with `ready` so the number in the PR is one the device produced, not one a
 * build machine guessed.
 */
(function boot() {
  var t0 = (window.performance && performance.now) ? performance.now() : Date.now();

  var run = function () {
    var root = document.getElementById('root');
    CHART = new Chart(root);

    // A chart with no bars is not a blank chart — it says so, and any levels the
    // host has already sent still draw, because those are real.
    CHART.empty.classList.add('is-on');

    requestAnimationFrame(function () {
      var t1 = (window.performance && performance.now) ? performance.now() : Date.now();
      post({
        type: 'ready',
        payload: {
          version: (window.LightweightCharts && window.LightweightCharts.version && window.LightweightCharts.version()) || 'unknown',
          firstPaintMs: Math.round(t1 - t0),
          reducedMotion: reducedMotion(),
          timeframes: TF_ORDER,
        },
      });
    });

    startFpsMeter();
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
})();

/**
 * A rolling frame-rate meter, reported only while the chart is actually moving.
 * "60fps" is a claim; this is the instrument that makes it a measurement, and it
 * costs one counter per frame.
 */
function startFpsMeter() {
  var frames = 0;
  var since = 0;
  var worst = 60;
  var sampling = false;

  var tick = function (now) {
    if (!since) since = now;
    frames++;
    if (now - since >= 1000) {
      var fps = Math.round((frames * 1000) / (now - since));
      if (sampling) {
        worst = Math.min(worst, fps);
        post({ type: 'fps', payload: { fps: fps, worst: worst } });
      }
      frames = 0; since = now; sampling = false;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);

  var wake = function () { sampling = true; };
  window.addEventListener('touchstart', wake, { passive: true });
  window.addEventListener('pointerdown', wake, { passive: true });
  window.addEventListener('wheel', wake, { passive: true });
  // Kai's own motion counts as motion worth measuring.
  window.__cc_wakeFps = wake;
}

})();
</script>
