<style>/* Palette lock 14. Every colour here is a token value from src/ui/tokens.ts. */

:root {
  --bg: #0B0B0E;
  --surface: #1C1C22;
  --surface2: #17171C;
  --text: #FFF7E8;
  --muted: #B9B0A8;
  --dim: #6E675F;
  --volt: #C8FF00;
  --violet: #8B4DFF;
  --violet-light: #CBB2FF;
  --hairline: rgba(255, 247, 232, 0.10);

  /* One curve for entering things, one for things moving on screen. Both are
     stronger than the CSS built-ins, which are too weak to read as intentional. */
  --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  --ease-in-out: cubic-bezier(0.77, 0, 0.175, 1);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  height: 100%;
  width: 100%;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  /* The page must never scroll, bounce or rubber-band: it is a panel inside a
     scroll view, and any scrolling of its own would steal the parent's gesture. */
  overscroll-behavior: none;
  touch-action: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  font-family: "Space Grotesk", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
}

#root {
  position: relative;
  height: 100%;
  width: 100%;
  background: var(--bg);
}

.chart-host {
  position: absolute;
  inset: 0;
  background: var(--bg);
}

/* ------------------------------------------------------------------ */
/* Timeframe rail                                                      */
/* ------------------------------------------------------------------ */

.tf-rail {
  position: absolute;
  top: 7px;
  left: 7px;
  z-index: 4;
  display: flex;
  gap: 1px;
  padding: 2px;
  border-radius: 7px;
  /* A floating layer over the plot, not an opaque strip that eats chart height. */
  background: rgba(23, 23, 28, 0.62);
  backdrop-filter: blur(14px) saturate(140%);
  -webkit-backdrop-filter: blur(14px) saturate(140%);
  border: 0.5px solid var(--hairline);
}

.tf-btn {
  appearance: none;
  border: 0;
  background: transparent;
  color: var(--dim);
  font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.02em;
  padding: 4px 6px;
  min-width: 26px;
  border-radius: 5px;
  cursor: pointer;
  /* Named properties only, never `all`. */
  transition: color 140ms var(--ease-out), background-color 140ms var(--ease-out), transform 110ms var(--ease-out);
}

.tf-btn:hover { color: var(--muted); }

/* Volt = a user action, even when Kai is the one performing it on your behalf.
   Kai's authorship is shown by the violet pointer standing on the button. */
.tf-btn.is-on {
  color: var(--volt);
  background: rgba(200, 255, 0, 0.10);
}

/* The press. It fires on pointer-down, so the button is already responding
   before the finger lifts. */
.tf-btn.is-down {
  transform: scale(0.94);
  background: rgba(200, 255, 0, 0.20);
  color: var(--volt);
}

/* ------------------------------------------------------------------ */
/* Kai's pointer                                                       */
/* ------------------------------------------------------------------ */

.kai-pointer {
  position: absolute;
  top: 0;
  left: 0;
  width: 0;
  height: 0;
  z-index: 8;
  pointer-events: none;
  opacity: 0;
  transition: opacity 180ms var(--ease-out);
  will-change: transform;
}

.kai-pointer.is-on { opacity: 1; }

.kai-pointer-halo {
  position: absolute;
  left: -13px;
  top: -13px;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 1px solid rgba(139, 77, 255, 0.55);
  background: rgba(139, 77, 255, 0.14);
  /* Scale, never scale(0): nothing in the world appears out of nothing. */
  transform: scale(0.92);
  transition: transform 130ms var(--ease-out), background-color 130ms var(--ease-out);
}

.kai-pointer-dot {
  position: absolute;
  left: -3px;
  top: -3px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--violet-light);
  box-shadow: 0 0 10px rgba(139, 77, 255, 0.75);
  transition: transform 130ms var(--ease-out);
}

.kai-pointer.is-press .kai-pointer-halo {
  transform: scale(0.62);
  background: rgba(139, 77, 255, 0.34);
}
.kai-pointer.is-press .kai-pointer-dot { transform: scale(0.78); }

/* ------------------------------------------------------------------ */
/* Crosshair OHLC readout                                              */
/* ------------------------------------------------------------------ */

.ohlc {
  position: absolute;
  top: 8px;
  right: 8px;
  z-index: 4;
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 4px 8px;
  border-radius: 7px;
  background: rgba(23, 23, 28, 0.78);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border: 0.5px solid var(--hairline);
  font-family: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 9.5px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
  opacity: 0;
  transform: translateY(-3px);
  transition: opacity 130ms var(--ease-out), transform 130ms var(--ease-out);
  pointer-events: none;
}

.ohlc.is-on { opacity: 1; transform: translateY(0); }
.ohlc-k { color: var(--dim); }
.ohlc-t { color: var(--muted); margin-right: 2px; }

/* ------------------------------------------------------------------ */
/* Timeframe crossfade veil                                            */
/* ------------------------------------------------------------------ */

/* Two different price series cutting straight from one to the other is the
   single most machine-like moment on a chart. 250ms of the surface colour over
   the top turns a cut into a change. */
.veil {
  position: absolute;
  inset: 0;
  z-index: 6;
  background: var(--bg);
  opacity: 0;
  pointer-events: none;
  transition: opacity 250ms var(--ease-in-out);
}
.veil.is-on { opacity: 0.92; }

/* ------------------------------------------------------------------ */
/* Empty                                                               */
/* ------------------------------------------------------------------ */

.empty {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 26px;
  z-index: 3;
  padding: 0 18px;
  text-align: center;
  font-size: 11.5px;
  line-height: 1.5;
  color: var(--dim);
  display: none;
  pointer-events: none;
}
.empty.is-on { display: block; }

/* ------------------------------------------------------------------ */
/* Reduced motion                                                      */
/* ------------------------------------------------------------------ */

/* Not "no feedback" — gentler feedback. The states still change; they just stop
   travelling. Durations in JS collapse to 0 at the same time (02-motion.js). */
@media (prefers-reduced-motion: reduce) {
  .kai-pointer,
  .kai-pointer-halo,
  .kai-pointer-dot,
  .tf-btn,
  .ohlc,
  .veil {
    transition-duration: 1ms !important;
  }
  .veil.is-on { opacity: 0; }
}
</style>

   * Stop now, wherever we are. The chart keeps the position it had reached —
   * we never snap back to the start and never jump to the target. That is the
   * "animate from the presentation value" rule: what is on screen IS the state.
   */
  cancel: function (reason) {
    var s = this._active;
    if (!s) return;
    this._active = null;
    if (this._raf) cancelAnimationFrame(this._raf);
    this._raf = 0;
    if (s.onDone) s.onDone(reason || 'interrupted');

/* ===== chart-web/src/03-annotations.js ===== */
/**
 * The annotation layer — a Lightweight Charts v5 series primitive.
 *
 * SIX PRIMITIVES, ONE RENDERER. `level`, `zone`, `trendline`, `box`, `vertical`
 * and `note` are drawn by one pass over one canvas rather than six plugin
 * objects, because they share a coordinate system, a z-order and a hit test, and
 * splitting them would only split the places a bug can hide.
 *
 * WHY CANVAS AND NOT DOM CHIPS: DOM chips positioned per frame lag the candles
 * by one frame during a camera tween — the line is drawn by the library on the
 * chart's own canvas, the chip by the browser's compositor, and at 500 ms of
 * eased scroll you can see them separate. Drawing both in the same pass means a
 * level and its label are, by construction, never out of register.
 *
 * SHAPE IS DERIVED FROM MEANING. The host sends `kind` (semantics) and geometry;
 * nothing sends a shape name twice:
 *   kind 'trendline' → two anchors     kind 'box'      → time × price rectangle
 *   kind 'vertical'  → a time marker   kind 'note'     → anchored text
 *   kind 'circle'    → a ring on one bar kind 'arrow'    → price → a level
 *   price + price2   → a zone          price only      → a level
 */

var CHIP_FONT = '500 9.5px "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace';
var TAG_FONT = '500 9.5px "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace';

function shapeOf(a) {
  if (a.kind === 'trendline') return 'trendline';
  if (a.kind === 'box') return 'box';
  if (a.kind === 'vertical') return 'vertical';
  if (a.kind === 'circle') return 'circle';
  if (a.kind === 'arrow') return 'arrow';
  if (a.kind === 'note') return 'note';
  if (a.price != null && a.price2 != null) return 'zone';
  return 'level';
}

function roundRect(ctx, x, y, w, h, r) {
  var rr = Math.min(r, h / 2, w / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.lineTo(x + w - rr, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + rr);
  ctx.lineTo(x + w, y + h - rr);
  ctx.quadraticCurveTo(x + w, y + h, x + w - rr, y + h);
  ctx.lineTo(x + rr, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - rr);
  ctx.lineTo(x, y + rr);
  ctx.quadraticCurveTo(x, y, x + rr, y);
  ctx.closePath();
}

/**
 * Per-annotation motion state. An annotation is not "set" and then present — it
 * ARRIVES: the line draws left to right, then the chip fades in behind Kai's
 * pointer. `flash` is the two-pulse acknowledgement ("this one, here").
 */
function AnnState() {
  this.bornAt = 0;      // performance.now() when it was added
  this.flashUntil = 0;  // pulse window end
  this.flashFrom = 0;
}

function AnnotationLayer() {
  this._chart = null;
  this._series = null;
  this._requestUpdate = null;
  this._items = [];
  this._state = {};       // id -> AnnState
  this._hidden = false;
  this._hit = [];         // media-space rects captured on the last draw, for taps
  // A rectangle the chips must not be drawn under — the floating timeframe
  // rail. A label hidden behind the control that changes timeframes is the
  // worst possible place to hide a level.
  this._avoid = null;
  this._bars = [];        // times, for placing a timestamp that is not exactly a bar
  this._raf = 0;
  this._self = this;
}

AnnotationLayer.prototype.attached = function (p) {
  this._chart = p.chart;
  this._series = p.series;
  this._requestUpdate = p.requestUpdate;
};
AnnotationLayer.prototype.detached = function () {
  this._chart = null; this._series = null; this._requestUpdate = null;
};
AnnotationLayer.prototype.updateAllViews = function () { /* geometry is read at draw time */ };

/**
 * THE PRICE SCALE HAS TO FIT WHAT KAI DREW, NOT JUST THE CANDLES.
 *
 * Without this the scale autoscales to the visible bars and nothing else, so an
 * annotation outside that range is drawn — correctly, at the right price — off
 * the top or bottom of the pane, where nobody will ever see it. It is not
 * clipped, logged or reported. The line simply is not on the screen.
 *
 * It went unnoticed because the show runs on a daily chart, where a trigger a
 * few percent away is comfortably inside the visible range. An ANSWER runs on
 * whatever the user is looking at, and on a 5-minute chart the visible range is
 * often under a percent — so every level Kai marked was off-screen and the only
 * thing left was an arrow rising from the last price toward one of them. A
 * vertical line labelled "To go", and nothing else. Which is exactly what it
 * looked like.
 *
 * NO CLAMP ON HOW FAR THIS WILL STRETCH, deliberately. Capping the expansion
 * would put back the silent failure it exists to remove: a level just past the
 * cap would be invisible again with nothing to indicate it. A squashed chart is
 * bad; a chart quietly missing the level being discussed is worse, because the
 * user believes what they can see. If it stretches too far, the annotations
 * toggle already turns them off.
 */
AnnotationLayer.prototype.autoscaleInfo = function () {
  if (this._hidden) return null;
  var lo = Infinity, hi = -Infinity, n = 0;
  for (var i = 0; i < this._items.length; i++) {
    var a = this._items[i];
    if (!a || a.status === 'hidden' || a.status === 'deleted') continue;
    var ps = [a.price, a.price2];
    for (var k = 0; k < ps.length; k++) {
      var v = ps[k];
      if (typeof v !== 'number' || !isFinite(v)) continue;
      if (v < lo) lo = v;
      if (v > hi) hi = v;
      n++;
    }
  }
  if (!n || !isFinite(lo) || !isFinite(hi)) return null;

  // where it reads as a border rather than a price.
  var pad = Math.max((hi - lo) * 0.04, Math.abs(hi) * 0.001, 0.01);
  return { priceRange: { minValue: lo - pad, maxValue: hi + pad } };
};

/** The library asks for views; we hand it one, in the normal layer. */
AnnotationLayer.prototype.paneViews = function () {
  var self = this;
  if (!this._view) {
    this._view = {
      zOrder: function () { return 'top'; },
      renderer: function () {
        return { draw: function (target) { self._draw(target); } };
      },
    };
  }
  return [this._view];
};

/**
 * The bar times, so a timestamp can be placed even when it is not exactly a
 * bar open. `timeToCoordinate` answers null for anything the series does not
 * contain — an anchor half a bar late, a level from a 5-minute setup on a
 * 15-minute chart — and a null x is why a box or a vertical silently vanishes.
 * Snapping to the nearest bar and going through the LOGICAL scale always
 * answers, and answers in the right place.
 */
AnnotationLayer.prototype.setBars = function (bars) {
  this._bars = bars || [];
};

/** Tell the layer where the floating chrome is, in plot coordinates. */
AnnotationLayer.prototype.setAvoid = function (rect) {
  this._avoid = rect;
};

AnnotationLayer.prototype.setHidden = function (on) {
  this._hidden = !!on;

};

/** Replace the whole set. Anything already on screen keeps its birth time so a
 *  re-send (a reload, a status change) does not replay every draw-in animation. */
AnnotationLayer.prototype.set = function (items) {
  var now = (window.performance || Date).now();
  var next = {};
  for (var i = 0; i < items.length; i++) {
    var id = items[i].id;
    next[id] = this._state[id] || new AnnState();
    if (!next[id].bornAt) next[id].bornAt = now;
  }
  this._state = next;
  this._items = items.slice();
  this._kick();
};

/** Add or replace a few. New ones animate in; existing ones just update. */
AnnotationLayer.prototype.add = function (items) {
  var now = (window.performance || Date).now();
  for (var i = 0; i < items.length; i++) {
    var a = items[i];
    var at = -1;
    for (var j = 0; j < this._items.length; j++) if (this._items[j].id === a.id) { at = j; break; }
    if (at === -1) {
      this._items.push(a);
      this._state[a.id] = new AnnState();
      this._state[a.id].bornAt = now;
    } else {
      this._items[at] = a;
      if (!this._state[a.id]) { this._state[a.id] = new AnnState(); this._state[a.id].bornAt = now; }
    }
  }
  this._kick();
};

AnnotationLayer.prototype.remove = function (ids) {
  var drop = {};
  for (var i = 0; i < ids.length; i++) drop[ids[i]] = true;
  this._items = this._items.filter(function (a) { return !drop[a.id]; });
  this._kick();
};

/** Two pulses. Used by `flash_annotation` and by the trigger candle. */
AnnotationLayer.prototype.flash = function (id, pulses) {
  var s = this._state[id];
  if (!s) return false;
  var now = (window.performance || Date).now();
  s.flashFrom = now;
  s.flashUntil = now + (pulses || 2) * 320;
  this._kick();
  return true;
};

AnnotationLayer.prototype.items = function () { return this._items; };

/**
 * Keep asking the chart to repaint while anything is still moving. The library
 * only redraws on its own events, so an annotation drawing itself in needs us to
 * drive the frames — and to STOP as soon as nothing is animating, because a
 * permanent rAF loop on a chart is a battery bug.
 */
AnnotationLayer.prototype._kick = function () {
  var self = this;
  if (this._raf) return;
  var tick = function () {
    self._raf = 0;
    if (self._requestUpdate) self._requestUpdate();
    if (self._animating()) self._raf = requestAnimationFrame(tick);
  };
  this._raf = requestAnimationFrame(tick);
};

AnnotationLayer.prototype._animating = function () {
  var now = (window.performance || Date).now();
  for (var i = 0; i < this._items.length; i++) {
    var s = this._state[this._items[i].id];
    if (!s) continue;
    if (now - s.bornAt < ANN_IN_MS) return true;
    if (now < s.flashUntil) return true;

};

var ANN_DRAW_MS = 220;   // the line growing left → right
var ANN_CHIP_MS = 160;   // the label fading in behind it
var ANN_IN_MS = ANN_DRAW_MS + ANN_CHIP_MS;

AnnotationLayer.prototype._draw = function (target) {
  var self = this;
  if (this._hidden || !this._items.length || !this._series) { this._hit = []; return; }

  target.useMediaCoordinateSpace(function (scope) {
    var ctx = scope.context;
    var W = scope.mediaSize.width;
    var H = scope.mediaSize.height;
    var now = (window.performance || Date).now();
    var ts = self._chart.timeScale();
    var hit = [];

    var toY = function (p) {
      var y = self._series.priceToCoordinate(p);
      return y == null ? null : y;
    };
    var bars = self._bars;
    var toX = function (t) {
      if (t == null) return null;
      var u = typeof t === 'number' ? t : Math.floor(Date.parse(t) / 1000);
      if (!isFinite(u)) return null;
      var x = ts.timeToCoordinate(u);
      if (x != null) return x;
      if (!bars.length) return null;
      // Nearest bar, then the logical scale — which extrapolates past both ends
      // rather than refusing, so an anchor just off the data still draws where
      // it belongs instead of disappearing.
      var lo = 0, hi = bars.length - 1;
      while (lo < hi) {
        var mid = (lo + hi) >> 1;
        if (bars[mid].time < u) lo = mid + 1; else hi = mid;
      }
      var idx = lo;
      if (idx > 0 && Math.abs(bars[idx - 1].time - u) < Math.abs(bars[idx].time - u)) idx -= 1;
      var step = bars.length > 1 ? bars[1].time - bars[0].time : 0;
      var frac = step ? (u - bars[idx].time) / step : 0;
      return ts.logicalToCoordinate(idx + Math.max(-3, Math.min(3, frac)));
    };

    /* -------- chip vertical de-collision -------- */
    // Two levels at the same price (a trigger at 504 and an entry that starts at
    // 504) draw their LINES exactly where the prices are — only the LABELS are
    // nudged apart, top-down, so both stay readable and tappable.
    var placed = [];
    var claimY = function (want) {
      var y = want;
      for (var k = 0; k < placed.length; k++) {
        if (Math.abs(y - placed[k]) < 15) y = placed[k] + 15;
      }
      placed.push(y);
      return y;
    };

    ctx.save();
    ctx.font = CHIP_FONT;
    ctx.textBaseline = 'middle';

    for (var i = 0; i < self._items.length; i++) {
      var a = self._items[i];
      if (a.status === 'hidden' || a.status === 'deleted') continue;
      var st = self._state[a.id] || new AnnState();
      var age = now - st.bornAt;
      var grow = Math.min(1, age / ANN_DRAW_MS);
      var grown = 1 - Math.pow(1 - grow, 3);                       // ease-out
      var chip = Math.max(0, Math.min(1, (age - ANN_DRAW_MS) / ANN_CHIP_MS));
      var dead = a.status === 'invalidated';
      var col = a.color || kindColor(a.kind);
      // Two pulses: the opacity swings, the line does not move. Motion that
      // moves a price line would be a lie about the price.
      var pulse = 1;
      if (now < st.flashUntil) {
        var ph = ((now - st.flashFrom) % 320) / 320;
        pulse = 0.45 + 0.55 * Math.abs(Math.cos(ph * Math.PI));
      }
      var base = (dead ? 0.34 : 0.92) * pulse;
      var shape = shapeOf(a);

      ctx.lineWidth = 1;
      ctx.strokeStyle = col;
      ctx.fillStyle = col;

      if (shape === 'zone') {
        var yA = toY(a.price), yB = toY(a.price2);
        if (yA == null || yB == null) continue;
        var top = Math.min(yA, yB), bot = Math.max(yA, yB);
        ctx.globalAlpha = 0.13 * pulse * (dead ? 0.4 : 1);
        ctx.fillStyle = col;
        ctx.fillRect(0, top, W * grown, Math.max(2, bot - top));
        ctx.globalAlpha = base * 0.8;
        ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.moveTo(0, top); ctx.lineTo(W * grown, top);
        ctx.moveTo(0, bot); ctx.lineTo(W * grown, bot); ctx.stroke();
        ctx.setLineDash([]);
        // The label goes on the PRICE it names, not on the top of the band. An
        // "Entry 504-507" chip hanging at 507 next to a tag reading 504.00 puts
        // the number a whole level away from where it is true.
        self._chipAndTag(ctx, a, col, claimY(yA), W, chip, base, hit, dead);

      } else if (shape === 'box') {
        var x1 = toX(a.ts_from), x2 = toX(a.ts_to);
        var by1 = toY(a.price), by2 = toY(a.price2);
        if (by1 == null || by2 == null) continue;
        if (x1 == null) x1 = 0;
        if (x2 == null) x2 = W;
        var bx = Math.min(x1, x2), bw = Math.max(3, Math.abs(x2 - x1)) * grown;
        var byT = Math.min(by1, by2), bh = Math.max(2, Math.abs(by2 - by1));
        ctx.globalAlpha = 0.14 * pulse * (dead ? 0.4 : 1);
        ctx.fillRect(bx, byT, bw, bh);
        ctx.globalAlpha = base * 0.85;
        ctx.setLineDash([3, 3]);
        ctx.strokeRect(bx + 0.5, byT + 0.5, bw - 1, bh - 1);
        ctx.setLineDash([]);
        self._chipAt(ctx, a, col, bx + 4, claimY(byT - 1), chip, base, hit, dead, W);

      } else if (shape === 'trendline') {
        var tx1 = toX(a.ts_from), tx2 = toX(a.ts_to);
        var ty1 = toY(a.price), ty2 = toY(a.price2 != null ? a.price2 : a.price);
        if (ty1 == null || ty2 == null) continue;
        if (tx1 == null) tx1 = 0;
        if (tx2 == null) tx2 = W;
        ctx.globalAlpha = base;
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(tx1, ty1);
        ctx.lineTo(tx1 + (tx2 - tx1) * grown, ty1 + (ty2 - ty1) * grown);
        ctx.stroke();
        // The anchors are the point of a trendline: two real bars, not a slope.
        ctx.globalAlpha = base * chip;
        ctx.beginPath(); ctx.arc(tx1, ty1, 2.6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(tx2, ty2, 2.6, 0, Math.PI * 2); ctx.fill();
        self._chipAt(ctx, a, col, Math.min(tx1, tx2) + 6, claimY(Math.min(ty1, ty2) - 1), chip, base, hit, dead, W);

      } else if (shape === 'vertical') {
        var vx = toX(a.ts_from);
        if (vx == null) continue;
        ctx.globalAlpha = base * 0.8;
        ctx.setLineDash([3, 4]);
        ctx.beginPath(); ctx.moveTo(vx, H * (1 - grown)); ctx.lineTo(vx, H); ctx.stroke();
        ctx.setLineDash([]);
        self._chipAt(ctx, a, col, vx + 5, claimY(12), chip, base, hit, dead, W);

      } else if (shape === 'circle') {
        // A ring around the bar being talked about. The RADIUS IS PRESENTATION,
        // not data — it is a constant in pixels, so the circle cannot be read as
        // a claim about how wide a zone is. Everything asserted (which bar,
        // which price) is the centre.
        var cx = toX(a.ts_from), cy = toY(a.price);
        if (cx == null || cy == null) continue;
        var rr0 = 26;
        // Drawn as a slightly out-of-round ellipse and started from the top:
        // a perfect circle appearing all at once reads as a UI element, and a
        // hand-drawn ring reads as someone marking up a chart.
        ctx.globalAlpha = base * 0.9;
        ctx.lineWidth = 1.6;
        ctx.beginPath();
        ctx.ellipse(cx, cy, rr0 * 1.15, rr0 * 0.8, -0.12, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * grown);
        ctx.stroke();
        self._chipAt(ctx, a, col, cx + rr0 * 1.15 + 4, claimY(cy), chip, base, hit, dead, W);

      } else if (shape === 'arrow') {
        // From where price is to the level it has not reached. Both ends are
        // real: the arrow says "this far to go" and cannot say it about a
        // number nobody stored.
        var ax = toX(a.ts_from), ax2 = toX(a.ts_to);
        var ay = toY(a.price), ay2 = toY(a.price2);
        if (ay == null || ay2 == null) continue;
        if (ax == null) ax = W * 0.72;
        if (ax2 == null) ax2 = ax;
        var ex = ax + (ax2 - ax) * grown, ey = ay + (ay2 - ay) * grown;
        ctx.globalAlpha = base;
        ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(ex, ey); ctx.stroke();
        // Head, oriented along the shaft rather than assumed vertical.
        var ang = Math.atan2(ey - ay, ex - ax);

        ctx.beginPath();
        ctx.moveTo(ex, ey);
        ctx.lineTo(ex - hd * Math.cos(ang - 0.42), ey - hd * Math.sin(ang - 0.42));
        ctx.lineTo(ex - hd * Math.cos(ang + 0.42), ey - hd * Math.sin(ang + 0.42));
        ctx.closePath();
        ctx.fill();
        self._chipAt(ctx, a, col, ex + 6, claimY((ay + ey) / 2), chip, base, hit, dead, W);

      } else if (shape === 'note') {
        var nx = toX(a.ts_from);
        var ny = toY(a.price);
        if (ny == null) ny = H * 0.2;
        if (nx == null) nx = 10;
        ctx.globalAlpha = base * 0.5;
        ctx.beginPath(); ctx.arc(nx, ny, 3, 0, Math.PI * 2); ctx.fill();
        self._chipAt(ctx, a, col, nx + 7, claimY(ny), chip, base, hit, dead, W);

      } else {
        var ly = toY(a.price);
        if (ly == null) continue;
        ctx.globalAlpha = base;
        ctx.setLineDash(dead ? [2, 4] : [4, 4]);
        ctx.beginPath();
        ctx.moveTo(0, Math.round(ly) + 0.5);
        ctx.lineTo(W * grown, Math.round(ly) + 0.5);
        ctx.stroke();
        ctx.setLineDash([]);
        self._chipAndTag(ctx, a, col, claimY(ly), W, chip, base, hit, dead);
      }
    }

    ctx.restore();
    self._hit = hit;
  });
};

/** The left label plus the price tag hanging on the right edge. */
AnnotationLayer.prototype._chipAndTag = function (ctx, a, col, y, W, chip, base, hit, dead) {
  // Slide out from under the rail rather than being covered by it. The LINE
  // still starts at x=0 — only the label moves, and only when it has to.
  this._chipAt(ctx, a, col, 4, y, chip, base, hit, dead, W);
  if (a.price == null || chip <= 0) return;
  var txt = fmtPrice(a.price);
  ctx.font = TAG_FONT;
  var w = ctx.measureText(txt).width + 10;
  var x = W - w - 3;
  ctx.globalAlpha = (dead ? 0.4 : 1) * chip;
  ctx.fillStyle = col;
  roundRect(ctx, x, y - 7.5, w, 15, 3);
  ctx.fill();
  ctx.fillStyle = TOKENS.bg;
  ctx.textAlign = 'center';
  ctx.fillText(txt, x + w / 2, y + 0.5);
  ctx.textAlign = 'left';
};

/** One label chip. Opaque, because the level's own dashed line runs behind it
 *  and a translucent chip made every label read struck through. */
AnnotationLayer.prototype._chipAt = function (ctx, a, col, x, y, chip, base, hit, dead, W) {
  if (chip <= 0) return;
  var label = a.text || KIND_LABEL[a.kind] || a.kind;
  ctx.font = CHIP_FONT;
  var w = ctx.measureText(label).width + 11 + (a.provenance === 'kai' ? 8 : 0);

  // A label always stays fully on the plot. A trendline anchored 40 bars off
  // the left edge would otherwise hang its chip in the margin, where all you
  // see is the last few pixels of a box and no word at all.
  if (typeof W === 'number') x = Math.max(4, Math.min(x, W - w - 46));
  // And it steps out from under the floating rail rather than hiding behind it.
  var av = this._avoid;
  if (av && y > av.y - 9 && y < av.y + av.h + 9 && x < av.x + av.w + 6) x = av.x + av.w + 6;
  ctx.globalAlpha = (dead ? 0.55 : 1) * chip;
  ctx.fillStyle = TOKENS.bg;
  roundRect(ctx, x, y - 7.5, w, 15, 3.5);
  ctx.fill();
  ctx.strokeStyle = withAlpha(col, 0.55);
  ctx.lineWidth = 0.75;
  ctx.stroke();
  ctx.fillStyle = col;
  ctx.fillText(label, x + 5.5, y + 0.5);
  // Kai's mark carries Kai's colour as a dot. Provenance is visible without
  // opening anything — you can see at a glance which lines you drew.
  if (a.provenance === 'kai') {
    ctx.fillStyle = TOKENS.violet;
    ctx.beginPath(); ctx.arc(x + w - 5, y, 2, 0, Math.PI * 2); ctx.fill();
  }
  // 44pt-ish tap target, taller than the chip it belongs to.
  hit.push({ id: a.id, x: x - 6, y: y - 15, w: w + 12, h: 30 });
};

/** Which annotation, if any, is under this tap. Nearest chip wins. */
AnnotationLayer.prototype.hitTest = function (x, y) {
  var best = null, bestD = Infinity;
  for (var i = 0; i < this._hit.length; i++) {
    var r = this._hit[i];
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) {
      var d = Math.abs(y - (r.y + r.h / 2));
      if (d < bestD) { bestD = d; best = r.id; }
    }
  }
  return best;
};

var KIND_LABEL = {
  trigger: 'Trigger', entry: 'Entry', stop: 'Stop', invalidation: 'Invalid',
  target: 'Target', support: 'Support', resistance: 'Resistance', note: 'Note',
  trendline: 'Trend', box: 'Zone', vertical: 'Mark',
};

function fmtPrice(p) {
  var n = Number(p);
  if (!isFinite(n)) return '—';
  return n >= 1000 ? n.toFixed(1) : n >= 1 ? n.toFixed(2) : n.toFixed(4);
}


/* ===== chart-web/src/04-session.js ===== */
/**
 * Pre-market / after-hours shading.
 *
 * A 5-minute chart that draws 04:00 and 19:30 exactly like 10:15 is telling the
 * user those bars are the same kind of thing. They are not: liquidity is thinner,
 * the spread is wider, and a level that "held" on 300 shares overnight held
 * nothing. So bars outside 09:30–16:00 New York sit on a faintly lighter ground.
 *
 * It is drawn UNDER the candles (zOrder 'bottom') and it is never labelled — the
 * point is peripheral, not a callout. Daily and 4-hour charts get no shading at
 * all, because the question does not apply to them.
 */
function SessionShading() {
  this._chart = null;
  this._series = null;
  this._runs = [];       // [{from, to}] in seconds, extended-hours spans
  this._on = false;
}

SessionShading.prototype.attached = function (p) { this._chart = p.chart; this._series = p.series; };
SessionShading.prototype.detached = function () { this._chart = null; this._series = null; };
SessionShading.prototype.updateAllViews = function () {};

SessionShading.prototype.paneViews = function () {
  var self = this;
  if (!this._view) {
    this._view = {
      zOrder: function () { return 'bottom'; },
      renderer: function () { return { draw: function (t) { self._draw(t); } }; },
    };
  }
  return [this._view];
};

/**
 * Recompute the extended-hours spans for a bar series.
 * Contiguous out-of-hours bars are merged into ONE span, so an overnight gap is
 * one rectangle rather than 200 abutting ones with seams between them.
 */
SessionShading.prototype.setBars = function (bars, timeframe) {
  this._on = timeframe === '1m' || timeframe === '5m' || timeframe === '15m' || timeframe === '1h';
  this._runs = [];
  if (!this._on || !bars.length) return;

  var open = null;
  var prev = null;
  var step = bars.length > 1 ? Math.max(60, bars[1].time - bars[0].time) : 300;
  for (var i = 0; i < bars.length; i++) {
    var t = bars[i].time;
    var ext = !isRegularHours(t);
    if (ext && open == null) open = t - step / 2;
    if (!ext && open != null) { this._runs.push({ from: open, to: prev + step / 2 }); open = null; }
    prev = t;
  }
  if (open != null) this._runs.push({ from: open, to: prev + step / 2 });
};

SessionShading.prototype._draw = function (target) {
  var self = this;
  if (!this._on || !this._runs.length || !this._chart) return;
  target.useMediaCoordinateSpace(function (scope) {
    var ctx = scope.context;
    var H = scope.mediaSize.height;
    var W = scope.mediaSize.width;
    var ts = self._chart.timeScale();
    ctx.save();
    ctx.fillStyle = TOKENS.session;
    for (var i = 0; i < self._runs.length; i++) {
      var a = ts.timeToCoordinate(self._runs[i].from);
      var b = ts.timeToCoordinate(self._runs[i].to);
      if (a == null && b == null) continue;
      if (a == null) a = 0;
      if (b == null) b = W;
      if (b < 0 || a > W) continue;
      ctx.fillRect(Math.max(0, a), 0, Math.min(W, b) - Math.max(0, a), H);
    }
    ctx.restore();
  });
};

/**
 * 09:30–16:00 America/New_York, DST included, without a timezone library.
 * `Intl.DateTimeFormat` knows the rules; a hardcoded UTC offset does not, and
 * would put the shading an hour out for half the year.
 */
var NY_FMT = null;
try {
  NY_FMT = new Intl.DateTimeFormat('en-US', {
    timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', weekday: 'short', hour12: false,
  });
} catch (e) { NY_FMT = null; }

function isRegularHours(unixSeconds) {
  if (!NY_FMT) return true;                 // no Intl: shade nothing rather than shade wrongly
  var parts = NY_FMT.formatToParts(new Date(unixSeconds * 1000));
  var h = 0, m = 0, wd = '';
  for (var i = 0; i < parts.length; i++) {
    if (parts[i].type === 'hour') h = parseInt(parts[i].value, 10) % 24;
    else if (parts[i].type === 'minute') m = parseInt(parts[i].value, 10);
    else if (parts[i].type === 'weekday') wd = parts[i].value;
  }
  if (wd === 'Sat' || wd === 'Sun') return false;
  var mins = h * 60 + m;
  return mins >= 570 && mins < 960;         // 09:30 .. 16:00
}


/* ===== chart-web/src/05-pointer.js ===== */
/**
 * Kai's pointer.
 *
 * This is the single element that turns "the state changed" into "somebody did
 * that". A price line that simply appears is a render. A violet cursor that
 * travels to the price, pauses, and only THEN leaves a line behind is a person
 * working. Nothing else in this lane buys as much for as little.
 *
 * It is violet because violet is Kai (palette lock 14: volt = you, violet = Kai,
 * cyan = the market). A volt pointer would be Kai impersonating the user.
 *
 * It is a DOM element, not canvas: it must be able to travel OFF the plot — over
 * the timeframe rail, over the price axis — and it must never be clipped by the
 * chart's own canvas bounds.
 */
function KaiPointer(root) {
  var el = document.createElement('div');
  el.className = 'kai-pointer';
  el.setAttribute('aria-hidden', 'true');
  el.innerHTML =
    '<div class="kai-pointer-halo"></div>' +
    '<div class="kai-pointer-dot"></div>';
  root.appendChild(el);

  this.el = el;
  this.x = -60;
  this.y = -60;
  this.visible = false;
  this._apply();
}

KaiPointer.prototype._apply = function () {
  // translate3d only: transform and opacity are the two properties that never
  // touch layout or paint, which is what keeps this at 60fps next to a chart
  // that is also redrawing.
  this.el.style.transform = 'translate3d(' + this.x.toFixed(1) + 'px,' + this.y.toFixed(1) + 'px,0)';
};

/** Travel to a point, eased, with the small overshoot a hand has. */
KaiPointer.prototype.moveTo = function (x, y, duration, done) {
  var self = this;
  var x0 = this.x, y0 = this.y;
  if (!this.visible) {
    // Appearing at the destination would be teleporting. Fade in where the
    // travel STARTS, then travel — nothing in the world appears mid-flight.
    this.x = x0 = x - (x - x0) * 0.18;
    this.y = y0 = y - (y - y0) * 0.18;
    this.show();
  }
  Motion.run({
    duration: duration,
    ease: 'pointer',
    onStep: function (p) {
      self.x = x0 + (x - x0) * p;
      self.y = y0 + (y - y0) * p;
      self._apply();
    },
    onDone: done || function () {},
  });
};

/** Snap without motion — used when reduced motion is on, and on re-show. */
KaiPointer.prototype.placeAt = function (x, y) {
  this.x = x; this.y = y; this._apply();
};

KaiPointer.prototype.show = function () {
  this.visible = true;
  this.el.classList.add('is-on');
};

KaiPointer.prototype.hide = function () {
  this.visible = false;
  this.el.classList.remove('is-on');
};

/**
 * The press. 90ms down, then release — the same shape as a finger, and short
 * enough that it reads as a click rather than a squeeze.
 */
KaiPointer.prototype.press = function (done) {
  var self = this;
  this.el.classList.add('is-press');
  var ms = reducedMotion() ? 0 : 90;
  setTimeout(function () {
    self.el.classList.remove('is-press');
    if (done) done();
  }, ms);
};

/* ------------------------------------------------------------------ */
/* The timeframe rail                                                  */
/* ------------------------------------------------------------------ */

/**
 * The rail lives INSIDE the chart surface rather than in React chrome above it,
 * for one reason: Kai's pointer has to be able to press it. A pointer that
 * travels to the edge of the WebView and stops, while a button outside changes
 * state on its own, is worse than no pointer at all.
 *
 * Active = volt, because choosing a timeframe is a USER action even when Kai is
 * the one doing it on the user's behalf. Kai's authorship is shown by the violet
 * pointer sitting on the button, not by recolouring the control.
 */
function TimeframeRail(root, onPick) {
  var el = document.createElement('div');
  el.className = 'tf-rail';
  el.setAttribute('role', 'tablist');
  el.setAttribute('aria-label', 'Chart timeframe');
  root.appendChild(el);

  this.el = el;
  this.buttons = {};
  this.value = null;
  this._onPick = onPick;
}

TimeframeRail.prototype.setOptions = function (options, value) {
  var self = this;
  this.el.innerHTML = '';
  this.buttons = {};
  for (var i = 0; i < options.length; i++) {
    (function (tf) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'tf-btn';
      b.textContent = tf;
      b.setAttribute('role', 'tab');
      b.setAttribute('data-tf', tf);
      // Feedback on pointer-DOWN, never on release: the moment a press shows up
      // late is the moment the whole surface stops feeling direct.
      b.addEventListener('pointerdown', function () { b.classList.add('is-down'); });
      var up = function () { b.classList.remove('is-down'); };
      b.addEventListener('pointerup', up);
      b.addEventListener('pointercancel', up);
      b.addEventListener('pointerleave', up);
      b.addEventListener('click', function () { self._onPick(tf, 'user'); });
      self.el.appendChild(b);
      self.buttons[tf] = b;
    })(options[i]);
  }
  this.setValue(value);
};

TimeframeRail.prototype.setValue = function (tf) {
  this.value = tf;
  for (var k in this.buttons) {
    if (!Object.prototype.hasOwnProperty.call(this.buttons, k)) continue;
    var on = k === tf;
    this.buttons[k].classList.toggle('is-on', on);
    this.buttons[k].setAttribute('aria-selected', on ? 'true' : 'false');
  }
};

/** Where the pointer should travel to, in page coordinates. */
TimeframeRail.prototype.centerOf = function (tf, rootRect) {
  var b = this.buttons[tf];
  if (!b) return null;
  var r = b.getBoundingClientRect();
  return { x: r.left - rootRect.left + r.width / 2, y: r.top - rootRect.top + r.height / 2 };
};

/** The visible press Kai performs. Same class the finger produces. */
TimeframeRail.prototype.pressVisual = function (tf, done) {
  var b = this.buttons[tf];
  if (!b) { if (done) done(); return; }
  b.classList.add('is-down');
  var ms = reducedMotion() ? 0 : 90;
  setTimeout(function () { b.classList.remove('is-down'); if (done) done(); }, ms);
};


/* ===== chart-web/src/06-chart.js ===== */
/**
 * The chart itself, and the camera Kai drives.
 *
 * EVERY CAMERA MOVE IS ONE OPERATION: setting the visible LOGICAL range.
 * Scroll, zoom, fit and "go to that candle" are all the same two numbers moving
 * — `{from, to}` in bar indices — which is why they can be eased with one tween
 * runner, interrupted at one place, and composed into a sequence without the
 * seams you get from mixing `scrollToPosition` with `applyOptions({barSpacing})`
 * with `setVisibleRange`. Bar spacing is a CONSEQUENCE (width / span), not an
 * input, so a zoom can never fight a scroll for the same frame.
 *
 * WHAT THE USER OWNS: `handleScroll` / `handleScale` / `kineticScroll` are the
 * library's own gesture stack — real momentum, real pinch, anchored on the pinch
 * centre. We do not reimplement any of it. The first touch on the glass cancels
 * whatever Kai was doing (see `_bindInterrupt`), which is the whole of rule 3 in
 * 02-motion.js applied to a chart.
 */

var LWC = window.LightweightCharts;

/** The rail, and the window each timeframe opens on. From the LIVE-1 brief. */
var TF_BARS = { D: 120, '4h': 120, '1h': 100, '15m': 96, '5m': 78, '1m': 90 };
var TF_ORDER = ['1m', '5m', '15m', '1h', '4h', 'D'];

function Chart(root) {
  var self = this;
  this.root = root;
  this.bars = [];               // normalized {time, open, high, low, close, value}
  this.timeframe = 'D';
  this.symbol = '';
  this.lastPrice = null;
  this.volumeOn = false;
  this._seq = 0;
  this._readyPosted = false;
  this._userTouching = false;

  var host = document.createElement('div');
  host.className = 'chart-host';
  root.appendChild(host);
  this.host = host;

  this.chart = LWC.createChart(host, {
    layout: {
      background: { type: 'solid', color: TOKENS.bg },
      textColor: TOKENS.dim,
      fontSize: 10,
      fontFamily: '"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace',
      attributionLogo: false,
    },
    grid: {
      vertLines: { color: TOKENS.grid },
      horzLines: { color: TOKENS.grid },
    },
    crosshair: {
      mode: LWC.CrosshairMode.Normal,
      vertLine: { color: withAlpha(TOKENS.text, 0.28), width: 1, style: 3, labelBackgroundColor: TOKENS.surface },
      horzLine: { color: withAlpha(TOKENS.text, 0.28), width: 1, style: 3, labelBackgroundColor: TOKENS.surface },
    },
    rightPriceScale: {
      borderColor: TOKENS.hairline,
      scaleMargins: { top: 0.12, bottom: 0.14 },
      entireTextOnly: true,
    },
    leftPriceScale: { visible: false },
    timeScale: {
      borderColor: TOKENS.hairline,
      rightOffset: 4,
      barSpacing: 6,
      minBarSpacing: 0.6,
      timeVisible: true,
      secondsVisible: false,
      lockVisibleTimeRangeOnResize: true,
    },
    // The brokerage gesture set, EMBEDDED. Vertical touch-drag is off because
    // the chart sits inside a scrolling page here: a finger moving down the
    // glass belongs to the page, and a chart that grabbed it would make the
    // screen impossible to scroll past.
    //
    // That is a property of being embedded, not of the chart, so the stage
    // turns it back on the moment the chart owns the whole screen — see
    // `setGestures`. It is the whole reason "I can't scroll vertically" was
    // true: nothing was broken, the chart was being a good citizen in a page
    // that no longer exists once you expand it.
    handleScroll: { mouseWheel: true, pressedMouseMove: true, horzTouchDrag: true, vertTouchDrag: false },
    handleScale: { axisPressedMouseMove: true, mouseWheel: true, pinch: true, axisDoubleClickReset: true },
    kineticScroll: { touch: true, mouse: false },
    autoSize: true,
    localization: {
      priceFormatter: function (p) { return fmtPrice(p); },
    },
  });

  this.series = this.chart.addSeries(LWC.CandlestickSeries, {
    upColor: TOKENS.green,
    downColor: TOKENS.red,
    borderVisible: false,
    wickUpColor: TOKENS.green,
    wickDownColor: TOKENS.red,
    priceLineVisible: true,
    // The last price is MARKET data, so it is cyan. Palette lock 14 reserves
    // volt for user actions; a volt price line would be the app claiming
    // authorship of the tape.
    priceLineColor: withAlpha(TOKENS.cyan, 0.6),
    priceLineWidth: 1,
    priceLineStyle: 2,
    lastValueVisible: true,
    priceFormat: { type: 'price', precision: 2, minMove: 0.01 },
  });

  // Volume rides on its own invisible scale pinned to the bottom 16%, so it can
  // be switched on later (LIVE-1b) without the candles ever moving.
  this.volume = this.chart.addSeries(LWC.HistogramSeries, {
    priceScaleId: 'vol',
    priceFormat: { type: 'volume' },
    color: withAlpha(TOKENS.cyan, 0.14),
    lastValueVisible: false,
    priceLineVisible: false,
    visible: false,
  });
  this.chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.86, bottom: 0 } });

  this.owns = false;
  this.autoScaleOn = true;

  this.session = new SessionShading();
  this.series.attachPrimitive(this.session);
  this.annotations = new AnnotationLayer();
  this.series.attachPrimitive(this.annotations);

  this.rail = new TimeframeRail(root, function (tf, who) { self._railPick(tf, who); });
  this.rail.setOptions(TF_ORDER, this.timeframe);
  this.pointer = new KaiPointer(root);

  this.legend = document.createElement('div');
  this.legend.className = 'ohlc';
  root.appendChild(this.legend);

  this.veil = document.createElement('div');
  this.veil.className = 'veil';
  root.appendChild(this.veil);

  this.empty = document.createElement('div');
  this.empty.className = 'empty';
  this.empty.textContent = 'No price bars for this timeframe yet. The levels are still real.';
  root.appendChild(this.empty);

  this._bindInterrupt();
  this._bindCrosshair();
  this._bindTaps();
  this._measureChrome();
  window.addEventListener('resize', function () { self._measureChrome(); });

  this.chart.timeScale().subscribeVisibleLogicalRangeChange(function () { self._postViewport(); });
}

/* ------------------------------------------------------------------ */
/* User input owns the camera the instant it arrives                   */
/* ------------------------------------------------------------------ */

Chart.prototype._bindInterrupt = function () {
  var self = this;
  var grab = function () {
    self._userTouching = true;
    // Not "queue the user behind Kai" and not "let both move it". The finger
    // wins, from wherever the tween had reached, and the host is told so it can
    // abandon the rest of the sequence instead of talking over the user.
    if (Motion.busy()) {
      Motion.cancel('interrupted');
      self.pointer.hide();
    }
  };
  var release = function () { self._userTouching = false; };

  /**
   * A vertical drag on the stage is the user claiming the price axis.
   *
   * Only when the chart OWNS the screen — embedded, a vertical finger belongs
   * to the page — and only when the movement is actually vertical, so a
   * slightly wonky horizontal scroll does not silently switch the scale to
   * manual and leave the next level Kai draws off the pane.
   */
  var startY = null;
  var startX = null;
  var onStart = function (e) {
    var t = e.touches && e.touches[0];
    startY = t ? t.clientY : e.clientY;
    startX = t ? t.clientX : e.clientX;
  };
  var onMove = function (e) {
    if (!self.owns || startY == null || !self.autoScaleOn) return;
    var t = e.touches && e.touches[0];
    var y = t ? t.clientY : e.clientY;
    var x = t ? t.clientX : e.clientX;
    if (Math.abs(y - startY) > 12 && Math.abs(y - startY) > Math.abs(x - startX)) {
      self.setAutoScale(false);
    }
  };
  this.host.addEventListener('touchstart', onStart, { passive: true });
  this.host.addEventListener('pointerdown', onStart, { passive: true });
  this.host.addEventListener('touchmove', onMove, { passive: true });
  this.host.addEventListener('pointermove', onMove, { passive: true });
  this.host.addEventListener('pointerdown', grab, { passive: true });
  this.host.addEventListener('touchstart', grab, { passive: true });
  this.host.addEventListener('wheel', grab, { passive: true });
  this.host.addEventListener('pointerup', release, { passive: true });
  this.host.addEventListener('touchend', release, { passive: true });
};

/* ------------------------------------------------------------------ */
/* Crosshair readout                                                   */
/* ------------------------------------------------------------------ */

Chart.prototype._bindCrosshair = function () {
  var self = this;
  this.chart.subscribeCrosshairMove(function (param) {
    if (!param || !param.time || !param.point) { self._clearLegend(); return; }
    var d = param.seriesData.get(self.series);
    if (!d) { self._clearLegend(); return; }
    var up = d.close >= d.open;
    var col = up ? TOKENS.green : TOKENS.red;
    var chg = d.open ? ((d.close - d.open) / d.open) * 100 : 0;
    self.legend.innerHTML =
      '<span class="ohlc-t">' + fmtTime(param.time, self.timeframe) + '</span>' +
      '<span class="ohlc-k">O</span><span>' + fmtPrice(d.open) + '</span>' +
      '<span class="ohlc-k">H</span><span>' + fmtPrice(d.high) + '</span>' +
      '<span class="ohlc-k">L</span><span>' + fmtPrice(d.low) + '</span>' +
      '<span class="ohlc-k">C</span><span style="color:' + col + '">' + fmtPrice(d.close) + '</span>' +
      '<span style="color:' + col + '">' + (chg >= 0 ? '+' : '') + chg.toFixed(2) + '%</span>';
    self.legend.classList.add('is-on');
    post({ type: 'crosshair', payload: { time: param.time, open: d.open, high: d.high, low: d.low, close: d.close } });
  });
};

Chart.prototype._clearLegend = function () {
  if (!this.legend.classList.contains('is-on')) return;
  this.legend.classList.remove('is-on');
  post({ type: 'crosshairEnd', payload: {} });
};

/* ------------------------------------------------------------------ */
/* Taps: annotation chips, and double-tap to reset                     */
/* ------------------------------------------------------------------ */

Chart.prototype._bindTaps = function () {
  var self = this;
  var lastTap = 0;
  this.host.addEventListener('pointerup', function (e) {
    var r = self.host.getBoundingClientRect();
    var x = e.clientX - r.left;
    var y = e.clientY - r.top;

    var id = self.annotations.hitTest(x, y);
    if (id) {
      self.annotations.flash(id, 1);
      post({ type: 'annotationTap', payload: { id: id } });
      lastTap = 0;
      return;
    }
    var now = Date.now();
    if (now - lastTap < 280) {
      // Double-tap is "put it back the way it was", the same promise as
      // double-tapping a photo back to fit. Not a zoom step.
      lastTap = 0;
      self.fitDefault(reducedMotion() ? 0 : 320);
    } else {
      lastTap = now;
    }
  });
};

/* ------------------------------------------------------------------ */
/* Data                                                                */
/* ------------------------------------------------------------------ */

Chart.prototype.setData = function (p) {
  // The brief's budget is "first paint < 400ms after mount with 1,500 bars", so
  // the thing measured has to be the whole job: normalise, sort, hand to the
  // series, shade the session, frame the window — and then wait for the frame
  // that actually shows it. A number taken before the rAF is a number about
  // parsing, not about painting.
  var t0 = (window.performance || Date).now();
  var raw = p.candles || [];
  var bars = [];
  var vols = [];
  for (var i = 0; i < raw.length; i++) {
    var c = raw[i];
    var t = typeof c.t === 'number' ? c.t : Math.floor(Date.parse(c.t) / 1000);
    if (!isFinite(t)) continue;
    var bar = { time: t, open: +c.o, high: +c.h, low: +c.l, close: +c.c };
    // Per-bar colour hook. Nothing sets it in LIVE-1; the RSI heatmap in LIVE-1b
    // sets `color`/`wickColor` per bar and this chart needs no change at all.
    if (c.color) { bar.color = c.color; bar.wickColor = c.wickColor || c.color; bar.borderColor = c.color; }
    bars.push(bar);
    vols.push({ time: t, value: +(c.v || 0), color: withAlpha(bar.close >= bar.open ? TOKENS.green : TOKENS.red, 0.16) });
  }
  bars.sort(function (a, b) { return a.time - b.time; });
  vols.sort(function (a, b) { return a.time - b.time; });

  var wasEmpty = this.bars.length === 0;
  this.bars = bars;
  this.symbol = p.symbol || this.symbol;
  if (p.timeframe) { this.timeframe = p.timeframe; this.rail.setValue(p.timeframe); }
  this.lastPrice = p.lastPrice == null ? (bars.length ? bars[bars.length - 1].close : null) : p.lastPrice;

  this.series.setData(bars);
  this.volume.setData(vols);
  this.session.setBars(bars, this.timeframe);
  this.annotations.setBars(bars);
  this.empty.classList.toggle('is-on', bars.length === 0);

  if (wasEmpty || p.resetView !== false) this.fitDefault(0);
  this._lower();
  this._postViewport();

  requestAnimationFrame(function () {
    post({
      type: 'painted',
      payload: { ms: Math.round(((window.performance || Date).now()) - t0), bars: bars.length },
    });
  });
};

/**
 * Hand the chart its full gesture set, or take it back.
 *
 * `own: true` is the chart on its own screen: vertical drag pans the price
 * axis, and a pinch scales both axes from the pinch centre. `own: false` is the
 * embedded chart inside a scrolling page, where the vertical axis belongs to
 * the page.
 *
 * The price scale's own autoscale is switched off while the user is panning it
 * by hand, because an autoscale that keeps re-fitting under a finger is a chart
 * fighting the person holding it. It comes back on `own: false`, and the double
 * tap on the axis restores it at any time.
 */
Chart.prototype.setGestures = function (own) {
  this.owns = !!own;
  this.chart.applyOptions({
    handleScroll: {
      mouseWheel: true,
      pressedMouseMove: true,
      horzTouchDrag: true,
      vertTouchDrag: !!own,
    },
    handleScale: {
      axisPressedMouseMove: own ? { time: true, price: true } : true,
      mouseWheel: true,
      pinch: true,
      axisDoubleClickReset: true,
    },
  });
  // Leaving the stage hands the vertical axis back to autoscale, so the
  // embedded chart is never left holding a range the user panned to on a
  // screen they have since closed.
  if (!own) this.setAutoScale(true);
};

/**
 * AUTOSCALE AND MANUAL PANNING ARE THE SAME CONTROL, AND ONLY ONE CAN WIN.
 *
 * `vertTouchDrag` alone does nothing while the price scale is auto-fitting:
 * the scale re-derives its range from the visible bars every frame, so a
 * finger drags the chart and the next frame puts it straight back. Measured —
 * the axis did not move by a pixel. Whoever set `vertTouchDrag` first was not
 * wrong, just incomplete, which is why "I can't scroll vertically" survived a
 * flag that looks like it fixes it.
 *
 * SO THE RULE IS WHOSE RANGE IT IS. Autoscale on means the CHART decides, and
 * that is what has to be true when Kai draws — it is the only reason a level
 * he marks is guaranteed to be on screen (see `autoscaleInfo`). The moment the
 * user drags the axis, it becomes THEIRS: autoscale off, their range stands,
 * and it keeps standing until they double-tap the axis or Kai starts talking
 * again. A chart that silently re-fits under someone's finger is a chart
 * arguing with them.
 */
Chart.prototype.setAutoScale = function (on) {
  this.autoScaleOn = !!on;
  this.chart.priceScale('right').applyOptions({ autoScale: !!on });
};

/**
 * Broadcast mode: the chart's own furniture gets out of the way.
 *
 * Only the timeframe rail lives inside this page, so only it is hidden here.
 * The rail is a CONTROL, and a control sitting on screen while Kai is talking
 * invites a tap that would interrupt him — the point of the mode is that there
 * is nothing to do but watch. Everything else about the chart is unchanged: the
 * candles, the levels and the pointer are the show, not chrome.
 */
Chart.prototype.setBroadcast = function (on) {
  this.broadcast = !!on;
  // Kai is about to draw. Give the scale back to the chart so everything he
  // marks is inside the pane, even if the user had panned away from it.
  if (on) this.setAutoScale(true);
  if (this.rail && this.rail.el) {
    this.rail.el.style.transition = 'opacity 260ms ease, transform 260ms ease';
    this.rail.el.style.opacity = on ? '0' : '1';
    this.rail.el.style.transform = on ? 'translateY(6px)' : 'translateY(0)';
    this.rail.el.style.pointerEvents = on ? 'none' : 'auto';
  }
};

/** Replace or append the newest bar without touching the camera. */
Chart.prototype.updateLast = function (c) {
  if (!c) return;
  var t = typeof c.t === 'number' ? c.t : Math.floor(Date.parse(c.t) / 1000);
  if (!isFinite(t)) return;
  var bar = { time: t, open: +c.o, high: +c.h, low: +c.l, close: +c.c };
  this.series.update(bar);
  if (this.bars.length && this.bars[this.bars.length - 1].time === t) this.bars[this.bars.length - 1] = bar;
  else this.bars.push(bar);
  this.lastPrice = bar.close;
};

Chart.prototype.setVolume = function (on) {
  this.volumeOn = !!on;
  this.volume.applyOptions({ visible: this.volumeOn });
};

/* ------------------------------------------------------------------ */
/* Camera                                                              */
/* ------------------------------------------------------------------ */

Chart.prototype._range = function () {
  var r = this.chart.timeScale().getVisibleLogicalRange();
  if (r) return { from: r.from, to: r.to };
  var n = this.bars.length || 1;
  return { from: Math.max(0, n - 100), to: n + 4 };
};

Chart.prototype._setRange = function (from, to) {
  if (!(to > from)) return;
  this.chart.timeScale().setVisibleLogicalRange({ from: from, to: to });
};

/**
 * The one tween every camera command funnels into: move `{from,to}` from where
 * it IS to where it should be. Interrupting reads the live value, so a cancelled
 * move leaves the chart exactly where the finger caught it.
 */
Chart.prototype._glide = function (target, duration, ease, id) {
  var self = this;
  var start = this._range();
  var f0 = start.from, t0 = start.to;
  var f1 = target.from, t1 = target.to;
  Motion.run({
    duration: duration,
    ease: ease || 'scroll',
    onStep: function (p) { self._setRange(f0 + (f1 - f0) * p, t0 + (t1 - t0) * p); },
    onDone: function (reason) { done(id, reason); },
  });
};

/** Index of the bar at (or nearest before) a timestamp. -1 when there is none. */
Chart.prototype._indexOf = function (time) {
  var t = typeof time === 'number' ? time : Math.floor(Date.parse(time) / 1000);
  if (!isFinite(t) || !this.bars.length) return -1;
  var best = -1;
  for (var i = 0; i < this.bars.length; i++) {
    if (this.bars[i].time <= t) best = i; else break;
  }
  return best === -1 ? 0 : best;
};

Chart.prototype.scrollByBars = function (bars, duration, id) {
  var r = this._range();
  this._glide({ from: r.from + bars, to: r.to + bars }, duration, 'scroll', id);
};

Chart.prototype.scrollToTime = function (time, align, duration, id) {
  var idx = this._indexOf(time);
  if (idx < 0) return done(id, 'done');
  var r = this._range();
  var span = r.to - r.from;
  // 0.62 rather than 0.5: the eye reads a chart left to right, so the candle
  // being discussed wants MORE history behind it than empty space ahead of it.
  var frac = align === 'right' ? 0.9 : align === 'left' ? 0.2 : 0.62;
  var from = idx - span * frac;
  this._glide({ from: from, to: from + span }, duration, 'scroll', id);
};

Chart.prototype.scrollToNow = function (duration, id) {
  var r = this._range();
  var span = r.to - r.from;
  var to = this.bars.length + 4;
  this._glide({ from: to - span, to: to }, duration, 'scroll', id);
};

Chart.prototype.zoomTo = function (barSpacing, anchorTime, duration, id) {
  var W = this.host.clientWidth || 320;
  var span = Math.max(6, W / Math.max(0.6, barSpacing));
  var r = this._range();
  var anchorIdx = anchorTime != null ? this._indexOf(anchorTime) : (r.from + r.to) / 2;
  // Keep the anchor bar at the same fraction of the width it already occupies,
  // so a zoom around a candle rotates the view about that candle instead of
  // sliding it sideways while the scale changes.
  var frac = Math.max(0.05, Math.min(0.95, (anchorIdx - r.from) / Math.max(1, r.to - r.from)));
  var from = anchorIdx - span * frac;
  this._glide({ from: from, to: from + span }, duration, 'zoom', id);
};

Chart.prototype.zoomToRange = function (t1, t2, padding, duration, id) {
  var a = this._indexOf(t1), b = this._indexOf(t2);
  if (a < 0 || b < 0) return done(id, 'done');
  var lo = Math.min(a, b), hi = Math.max(a, b);
  var pad = padding == null ? 0.12 : padding;
  var span = Math.max(8, hi - lo);
  this._glide({ from: lo - span * pad, to: hi + span * pad }, duration, 'zoom', id);
};

/** The timeframe's own default window (brief: D 120 · 4h 120 · 1h 100 · 15m 96 · 5m 78 · 1m 90). */
Chart.prototype.fitDefault = function (duration, id) {
  var want = TF_BARS[this.timeframe] || 100;
  var n = this.bars.length;
  var to = n + 4;
  var from = Math.max(-2, to - Math.min(want, Math.max(20, n)) - 4);
  if (!duration) { this._setRange(from, to); return done(id, 'done'); }
  this._glide({ from: from, to: to }, duration, 'zoom', id);
};

/* ------------------------------------------------------------------ */
/* Timeframe: the button presses, then the chart crossfades            */
/* ------------------------------------------------------------------ */

Chart.prototype._railPick = function (tf, who) {
  if (tf === this.timeframe) return;
  this.rail.setValue(tf);
  this.timeframe = tf;
  this.crossfadeIn();
  post({ type: 'timeframe', payload: { timeframe: tf, by: who || 'user' } });
};

/** Veil up. It comes back down when the new bars land (or after a beat, if the
 *  host has nothing new to send). Never a hard cut between two price series. */
Chart.prototype.crossfadeIn = function () {
  var self = this;
  if (reducedMotion()) return;
  this.veil.classList.add('is-on');
  clearTimeout(this._veilT);
  this._veilT = setTimeout(function () { self.veil.classList.remove('is-on'); }, 900);
};

Chart.prototype._lower = function () {
  var self = this;
  clearTimeout(this._veilT);
  // One frame of the new data on screen before the veil lifts, so the fade
  // reveals the new chart rather than dissolving into an empty one.
  requestAnimationFrame(function () { self.veil.classList.remove('is-on'); });
};

Chart.prototype.setTimeframe = function (tf, id) {
  if (!TF_BARS[tf]) return done(id, 'done');
  // The host re-asserts the timeframe whenever its own state settles, which is
  // correct and would otherwise crossfade a chart that never changed. Switching
  // to what is already on screen is a no-op, not a transition.
  if (tf === this.timeframe) return done(id, 'done');
  this.rail.setValue(tf);
  this.timeframe = tf;
  this.session.setBars(this.bars, tf);
  this.crossfadeIn();
  post({ type: 'timeframe', payload: { timeframe: tf, by: 'kai' } });
  done(id, 'done');
};

/* ------------------------------------------------------------------ */
/* Pointer, in chart coordinates                                       */
/* ------------------------------------------------------------------ */

Chart.prototype.rootRect = function () { return this.root.getBoundingClientRect(); };

/**
 * Where the floating rail sits, in PLOT coordinates, so annotation chips can
 * step around it. Measured once and on resize — reading layout every frame
 * would force a reflow inside the render loop.
 */
Chart.prototype._measureChrome = function () {
  var r = this.rail.el.getBoundingClientRect();
  var h = this.host.getBoundingClientRect();
  this.annotations.setAvoid({ x: r.left - h.left, y: r.top - h.top, w: r.width, h: r.height });
};

/** Resolve {x|time, y|price} into page coordinates inside the chart surface. */
Chart.prototype.resolvePoint = function (p) {
  var hostRect = this.host.getBoundingClientRect();
  var rootRect = this.rootRect();
  var dx = hostRect.left - rootRect.left;
  var dy = hostRect.top - rootRect.top;
  var x, y;

  if (p.rail) {
    var c = this.rail.centerOf(p.rail, rootRect);
    if (c) return c;
  }
  if (p.time != null) {
    var cx = this.chart.timeScale().timeToCoordinate(
      typeof p.time === 'number' ? p.time : Math.floor(Date.parse(p.time) / 1000)
    );
    x = cx == null ? this.host.clientWidth * 0.62 : cx;
  } else if (p.x != null) {
    x = p.x <= 1 ? this.host.clientWidth * p.x : p.x;
  } else {
    x = this.host.clientWidth * 0.62;
  }
  if (p.price != null) {
    var cy = this.series.priceToCoordinate(p.price);
    y = cy == null ? this.host.clientHeight * 0.5 : cy;
  } else if (p.y != null) {
    y = p.y <= 1 ? this.host.clientHeight * p.y : p.y;
  } else {
    y = this.host.clientHeight * 0.5;
  }
  return { x: x + dx, y: y + dy };
};

/* ------------------------------------------------------------------ */
/* Viewport reporting                                                  */
/* ------------------------------------------------------------------ */

Chart.prototype._postViewport = function () {
  var r = this.chart.timeScale().getVisibleLogicalRange();
  if (!r) return;
  var W = this.host.clientWidth || 1;
  post({
    type: 'viewport',
    payload: {
      from: r.from, to: r.to,
      barSpacing: W / Math.max(1, r.to - r.from),
      firstTime: this.bars.length ? this.bars[Math.max(0, Math.min(this.bars.length - 1, Math.round(r.from)))].time : null,
      lastTime: this.bars.length ? this.bars[Math.max(0, Math.min(this.bars.length - 1, Math.round(r.to)))].time : null,
    },
  });
};

function fmtTime(t, tf) {
  var d = new Date((typeof t === 'number' ? t : Date.parse(t) / 1000) * 1000);
  if (tf === 'D') return d.toISOString().slice(0, 10);
  try {
    return new Intl.DateTimeFormat('en-US', {
      timeZone: 'America/New_York', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit',
    }).format(d);
  } catch (e) { return d.toISOString().slice(5, 16).replace('T', ' '); }
}


/* ===== chart-web/src/07-bridge.js ===== */
/**
 * The bridge. One message shape in both directions, one transport per platform.
 *
 *   native  →  window.ReactNativeWebView.postMessage(json)
 *   web     →  window.parent.postMessage(obj, '*')     (iframe, same origin)
 *
 * EVERY HOST COMMAND CARRIES AN `id`, AND EVERY CAMERA COMMAND ANSWERS WITH
 * `done{id, reason}`. That is not bookkeeping — it is what lets a choreography
 * be a SEQUENCE rather than a pile of setTimeouts. Step 3 starts when step 2
 * actually finished, on this device, at this frame rate; and when the user
 * grabs the chart mid-move, step 2 answers `interrupted` and the rest of the
 * sequence is abandoned instead of talking over them.
 *
 * The page never fetches. No `<script src>`, no XHR, no websocket: data and
 * commands arrive over this channel and nowhere else. A chart that can reach the
 * network is a chart that can show a number nobody in the app can account for.
 */

var NATIVE = !!(window.ReactNativeWebView && window.ReactNativeWebView.postMessage);

function post(msg) {
  try {
    if (NATIVE) window.ReactNativeWebView.postMessage(JSON.stringify(msg));
    else if (window.parent && window.parent !== window) window.parent.postMessage(msg, '*');
  } catch (e) { /* a dead bridge must not take the chart down with it */ }
}

/** Resolve one host command. `reason` is 'done' | 'interrupted' | 'superseded'. */
function done(id, reason) {
  if (id == null) return;
  post({ type: 'done', id: id, payload: { reason: reason || 'done' } });
}

var CHART = null;

function handle(msg) {
  if (!msg || typeof msg !== 'object') return;
  var id = msg.id;
  var p = msg.payload || {};
  var c = CHART;
  if (!c) return;

  try {
    switch (msg.type) {
      case 'ping': return done(id, 'done');

      case 'setTheme': {
        for (var k in p.tokens || {}) {
          if (Object.prototype.hasOwnProperty.call(p.tokens, k)) TOKENS[k] = p.tokens[k];
        }
        return done(id, 'done');
      }

      case 'setReducedMotion': setReducedMotion(p.on); return done(id, 'done');
      // The chart owns the screen (the stage) or is embedded in a page.
      case 'setGestures': c.setGestures(p.own); return done(id, 'done');
      // Kai is talking; the chart's own controls step back.
      case 'setBroadcast': c.setBroadcast(p.on); return done(id, 'done');
      case 'setVolume': c.setVolume(p.on); return done(id, 'done');
      case 'setData': c.setData(p); return done(id, 'done');
      case 'updateLast': c.updateLast(p.candle || p); return done(id, 'done');
      case 'setTimeframe': return c.setTimeframe(p.timeframe || p.tf, id);

      /* -------- camera -------- */
      case 'camera.scrollByBars': return c.scrollByBars(p.bars || 0, dur(p), id);
      case 'camera.scrollToTime': return c.scrollToTime(p.time, p.align, dur(p), id);
      case 'camera.scrollToNow': return c.scrollToNow(dur(p), id);
      case 'camera.zoomTo': return c.zoomTo(p.barSpacing, p.anchorTime, dur(p), id);
      case 'camera.zoomToRange': return c.zoomToRange(p.from, p.to, p.padding, dur(p), id);
      case 'camera.fit': return c.fitDefault(dur(p), id);
      case 'camera.cancel': Motion.cancel('superseded'); return done(id, 'done');

      /* -------- annotations -------- */
      case 'annotations.set': c.annotations.set(p.annotations || []); return done(id, 'done');
      case 'annotations.add': c.annotations.add(p.annotations || []); return done(id, 'done');
      case 'annotations.remove': c.annotations.remove(p.ids || []); return done(id, 'done');
      case 'annotations.flash': c.annotations.flash(p.id, p.pulses); return done(id, 'done');
      case 'annotations.hidden': c.annotations.setHidden(p.on); return done(id, 'done');

      /* -------- Kai's pointer -------- */
      case 'pointer.moveTo': {
        var pt = c.resolvePoint(p);
        return c.pointer.moveTo(pt.x, pt.y, dur(p, 380), function (reason) { done(id, reason); });
      }
      case 'pointer.press': {
        // Pressing a rail button is a press ON SOMETHING: the button has to look
        // pressed too, or the pointer is miming.
        if (p.rail) return c.rail.pressVisual(p.rail, function () { c.pointer.press(function () { done(id, 'done'); }); });
        return c.pointer.press(function () { done(id, 'done'); });
      }
      case 'pointer.hide': c.pointer.hide(); return done(id, 'done');
      case 'pointer.show': c.pointer.show(); return done(id, 'done');

      default:
        return post({ type: 'error', id: id, payload: { message: 'Unknown chart command: ' + msg.type } });
    }
  } catch (e) {
    post({ type: 'error', id: id, payload: { message: String((e && e.message) || e) } });
    done(id, 'done');
  }
}

/** Durations are jittered ±10% here, once, so every caller inherits it. */
function dur(p, fallback) {
  var d = p.duration == null ? (fallback == null ? 420 : fallback) : p.duration;
  return p.jitter === false ? d : jitter(d);
}

function receive(ev) {
  var data = ev && ev.data;
  if (typeof data === 'string') {
    try { data = JSON.parse(data); } catch (e) { return; }
  }
  handle(data);
}

window.addEventListener('message', receive);
// react-native-webview delivers injected messages on `document` on Android and
// on `window` on iOS. Listening to both is the whole of the platform difference.
document.addEventListener('message', receive);


/* ===== chart-web/src/08-boot.js ===== */
/**
 * Boot.
 *
 * NO WHITE FLASH: the document is painted `#0B0B0E` by the stylesheet before a
 * line of this runs, and the WebView itself is given the same colour, so the
 * three moments that used to flash white (WebView creation, first paint, chart
 * canvas insertion) are all already the surface colour.
 *
 * FIRST PAINT IS MEASURED, NOT ASSUMED. `firstPaintMs` is reported to the host
 * with `ready` so the number in the PR is one the device produced, not one a
 * build machine guessed.
 */
(function boot() {
  var t0 = (window.performance && performance.now) ? performance.now() : Date.now();

  var run = function () {
    var root = document.getElementById('root');
    CHART = new Chart(root);

    // A chart with no bars is not a blank chart — it says so, and any levels the
    // host has already sent still draw, because those are real.
    CHART.empty.classList.add('is-on');

    requestAnimationFrame(function () {
      var t1 = (window.performance && performance.now) ? performance.now() : Date.now();
      post({
        type: 'ready',
        payload: {
          version: (window.LightweightCharts && window.LightweightCharts.version && window.LightweightCharts.version()) || 'unknown',
          firstPaintMs: Math.round(t1 - t0),
          reducedMotion: reducedMotion(),
          timeframes: TF_ORDER,
        },
      });
    });

    startFpsMeter();
  };

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', run);
  else run();
})();

/**
 * A rolling frame-rate meter, reported only while the chart is actually moving.
 * "60fps" is a claim; this is the instrument that makes it a measurement, and it
 * costs one counter per frame.
 */
function startFpsMeter() {
  var frames = 0;
  var since = 0;
  var worst = 60;
  var sampling = false;

  var tick = function (now) {
    if (!since) since = now;
    frames++;
    if (now - since >= 1000) {
      var fps = Math.round((frames * 1000) / (now - since));
      if (sampling) {
        worst = Math.min(worst, fps);
        post({ type: 'fps', payload: { fps: fps, worst: worst } });
      }
      frames = 0; since = now; sampling = false;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);

  var wake = function () { sampling = true; };
  window.addEventListener('touchstart', wake, { passive: true });
  window.addEventListener('pointerdown', wake, { passive: true });
  window.addEventListener('wheel', wake, { passive: true });
  // Kai's own motion counts as motion worth measuring.
  window.__cc_wakeFps = wake;
}

})();
</script>
