<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#050507;padding:24px}</style></head><body>
<helmet>
<meta name="theme-color" content="#0B0B0E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --surface-market-info:#0F2733; --surface-positive:#122A1E; --surface-risk:#2E1517; }
body { margin:0; background:#060608; }
a { color:#C8FF00; text-decoration:none; }
a:hover { color:#DEFF66; }
</style>
</helmet><div data-screen-label="Onboarding goal" style="height:100%; background:radial-gradient(420px 320px at 20% -5%, rgba(139,92,246,0.14), transparent 60%), #0B0B0E; display:flex; flex-direction:column; box-sizing:border-box; padding:80px 20px 44px;">
        <div style="display:flex; gap:6px; margin-bottom:24px;"><span style="flex:1; height:4px; border-radius:2px; background:#C8FF00;"></span><span style="flex:1; height:4px; border-radius:2px; background:rgba(255,247,232,0.12);"></span><span style="flex:1; height:4px; border-radius:2px; background:rgba(255,247,232,0.12);"></span><span style="flex:1; height:4px; border-radius:2px; background:rgba(255,247,232,0.12);"></span></div>
        <div style="font-size:27px; font-weight:700; letter-spacing:-0.4px; line-height:1.2;">What do you want to do?</div>
        <div style="font-size:14px; color:#B9B0A8; margin-top:8px;">Pick your main focus. You can switch anytime.</div>
        <div style="display:flex; flex-direction:column; gap:12px; margin-top:24px; flex:1;">
          <div onClick="{{ pickDay }}" style="border-radius:20px; padding:18px; cursor:pointer; background:{{ goalDayBg }}; border:{{ goalDayBorder }}; display:flex; align-items:center; gap:14px;">
            <div style="width:42px; height:42px; border-radius:12px; background:rgba(200,255,0,0.12); display:flex; align-items:center; justify-content:center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#C8FF00" stroke-width="2"><path d="M13 3 4 14h6l-1 7 9-11h-6l1-7z"></path></svg></div>
            <div style="flex:1;"><div style="font-size:17px; font-weight:700;">Trade Today</div><div style="font-size:13px; color:#B9B0A8; margin-top:2px;">Enter and exit opportunities in one day.</div></div>
          </div>
          <div onClick="{{ pickSwing }}" style="border-radius:20px; padding:18px; cursor:pointer; background:{{ goalSwingBg }}; border:{{ goalSwingBorder }}; display:flex; align-items:center; gap:14px;">
            <div style="width:42px; height:42px; border-radius:12px; background:rgba(255,247,232,0.06); display:flex; align-items:center; justify-content:center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9B0A8" stroke-width="2"><rect x="3" y="4" width="18" height="17" rx="2"></rect><path d="M8 2v4M16 2v4M3 10h18"></path></svg></div>
            <div style="flex:1;"><div style="font-size:17px; font-weight:700;">Trade Over Time</div><div style="font-size:13px; color:#B9B0A8; margin-top:2px;">Hold opportunities for days or weeks.</div></div>
          </div>
          <div onClick="{{ pickInvest }}" style="border-radius:20px; padding:18px; cursor:pointer; background:{{ goalInvestBg }}; border:{{ goalInvestBorder }}; display:flex; align-items:center; gap:14px;">
            <div style="width:42px; height:42px; border-radius:12px; background:rgba(255,247,232,0.06); display:flex; align-items:center; justify-content:center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9B0A8" stroke-width="2"><path d="M3 21h18M6 21V11M12 21V5M18 21v-8"></path></svg></div>
            <div style="flex:1;"><div style="font-size:17px; font-weight:700;">Build My Portfolio</div><div style="font-size:13px; color:#B9B0A8; margin-top:2px;">Grow long-term wealth with less involvement.</div></div>
          </div>
        </div>
        <div onClick="{{ goOb2 }}" style="height:52px; border-radius:999px; background:#C8FF00; color:#0B0B0E; display:flex; align-items:center; justify-content:center; gap:8px; font-size:16px; font-weight:700; cursor:pointer;">Continue <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#0B0B0E" stroke-width="2.4"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></div>
      </div>
    </sc-if>

    <!-- ONBOARDING 2 · RISK -->
    <sc-if value="{{ sOb2 }}" hint-placeholder-val="{{ false }}">
      </body></html>
