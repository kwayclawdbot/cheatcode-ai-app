<!doctype html><html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"><style>body{margin:0;background:#050507;padding:24px}</style></head><body>
<helmet>
<meta name="theme-color" content="#0B0B0E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --surface-market-info:#0F2733; --surface-positive:#122A1E; --surface-risk:#2E1517; }
body { margin:0; background:#060608; }
a { color:#C8FF00; text-decoration:none; }
a:hover { color:#DEFF66; }
</style>
</helmet><div data-screen-label="Order confirmed" style="height:100%; background:radial-gradient(460px 360px at 50% -8%, rgba(53,208,127,0.14), transparent 62%), #0B0B0E; display:flex; flex-direction:column; box-sizing:border-box; padding:140px 24px 48px; align-items:center;">
        <div style="width:72px; height:72px; border-radius:50%; background:rgba(53,208,127,0.12); border:1px solid rgba(53,208,127,0.5); display:flex; align-items:center; justify-content:center;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#35D07F" stroke-width="2.4"><path d="M20 6 9 17l-5-5"></path></svg></div>
        <div style="font-size:24px; font-weight:700; margin-top:20px;">Sent to Robinhood</div>
        <div style="font-size:14px; color:#B9B0A8; margin-top:8px; text-align:center; line-height:1.5;">Buy META · 1.29 shares · limit $504.00<br>Stop 498 and target 520 are attached.</div>
        <div style="margin-top:22px; width:100%; box-sizing:border-box; border-radius:16px; padding:13px 15px; background:linear-gradient(160deg, rgba(139,92,246,0.2), rgba(139,92,246,0.06)); border:0.5px solid rgba(139,92,246,0.5); box-shadow:inset 0 1px 0 rgba(196,181,253,0.16); display:flex; align-items:flex-start; gap:10px;">
          <div style="width:24px; height:24px; border-radius:50%; flex-shrink:0; background:radial-gradient(circle at 35% 35%, #C4B5FD, #8B5CF6 55%, #6D28D9); box-shadow:0 0 10px rgba(139,92,246,0.5);"></div>
          <div style="font-size:13px; line-height:1.5;">Your order was sent to Robinhood. It has not filled yet — I'm watching the order and will tell you the moment it fills.</div>
        </div>
        <div style="flex:1;"></div>
        <div onClick="{{ goAsset }}" style="width:100%; height:52px; border-radius:999px; background:#C8FF00; color:#0B0B0E; display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700; cursor:pointer; box-sizing:border-box;">View pending order</div>
        <div onClick="{{ goHome }}" style="width:100%; height:46px; border-radius:999px; border:0.5px solid rgba(255,247,232,0.24); display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:600; cursor:pointer; margin-top:8px; box-sizing:border-box;">Done</div>
      </div>
    </sc-if>

    <!-- ACCOUNT -->
    <sc-if value="{{ sAccount }}" hint-placeholder-val="{{ false }}">
      </body></html>
